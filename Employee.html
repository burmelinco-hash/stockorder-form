<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;min-height:100vh;color:#222}
/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:#fff;border-radius:16px;padding:40px 36px;box-shadow:0 4px 24px rgba(0,0,0,.12);width:100%;max-width:380px;text-align:center}
.login-card h1{font-size:1.4rem;color:#1a1a2e;margin-bottom:6px}
.login-card p{color:#888;font-size:.9rem;margin-bottom:24px}
.login-card input{width:100%;padding:12px 14px;border:2px solid #e2e8f0;border-radius:8px;font-size:1rem;margin-bottom:14px;text-align:center;letter-spacing:.1em}
.login-card input:focus{outline:none;border-color:#7c3aed}
.btn-login{width:100%;padding:13px;background:#7c3aed;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer}
.btn-login:hover{background:#6d28d9}
.login-err{color:#b91c1c;font-size:.88rem;margin-top:8px;display:none}
/* ── DASHBOARD ── */
#dashboard{display:none}
nav{background:#1a1a2e;color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
nav h1{font-size:1.15rem;font-weight:700}
.nav-right{display:flex;align-items:center;gap:14px}
.stat-pill{background:rgba(255,255,255,.12);padding:5px 14px;border-radius:20px;font-size:.82rem}
.btn-logout{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 14px;border-radius:8px;font-size:.82rem;cursor:pointer}
.btn-logout:hover{background:rgba(255,255,255,.1)}
.dash-body{max-width:960px;margin:0 auto;padding:24px 16px}
/* Filter tabs */
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:7px 18px;border-radius:20px;border:2px solid #e2e8f0;background:#fff;font-size:.87rem;font-weight:600;cursor:pointer;color:#888;transition:.15s}
.tab.active{background:#7c3aed;border-color:#7c3aed;color:#fff}
.tab-count{font-size:.75rem;background:rgba(0,0,0,.1);border-radius:10px;padding:1px 7px;margin-left:5px}
.tab.active .tab-count{background:rgba(255,255,255,.25)}
/* Order cards */
.order-card{background:#fff;border-radius:12px;margin-bottom:14px;box-shadow:0 1px 8px rgba(0,0,0,.07);overflow:hidden}
.order-header{padding:16px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.order-header:hover{background:#fafafa}
.order-id{font-weight:700;color:#1a1a2e;font-size:.93rem;min-width:140px}
.order-customer{color:#555;font-size:.9rem;flex:1}
.order-date{color:#aaa;font-size:.82rem;min-width:120px;text-align:right}
.status-badge{padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:700;white-space:nowrap}
.status-pending  {background:#fef9c3;color:#92400e}
.status-invoiced {background:#dbeafe;color:#1e40af}
.status-completed{background:#dcfce7;color:#15803d}
.expand-icon{color:#bbb;font-size:1rem;transition:transform .2s;flex-shrink:0}
.expanded .expand-icon{transform:rotate(180deg)}
/* Order body */
.order-body{display:none;padding:0 20px 20px;border-top:1px solid #f0f2f5}
.order-body.open{display:block}
.customer-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:16px 0;background:#f8fafc;border-radius:8px;padding:14px}
.info-item label{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:#aaa;display:block;margin-bottom:2px}
.info-item span{font-size:.92rem;color:#333;font-weight:500}
/* Items table */
table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:12px}
thead th{background:#f8fafc;padding:9px 12px;text-align:left;font-size:.75rem;text-transform:uppercase;color:#aaa;border-bottom:2px solid #e2e8f0}
tbody td{padding:10px 12px;border-bottom:1px solid #f4f4f4;color:#333}
tbody tr:last-child td{border-bottom:none}
.qty-badge{display:inline-block;background:#ede9fe;color:#5b21b6;padding:2px 9px;border-radius:10px;font-weight:700;font-size:.85rem}
.notes-box{margin-top:12px;padding:12px 14px;background:#fffbeb;border-radius:8px;border-left:3px solid #f59e0b;font-size:.88rem;color:#555}
/* Action buttons */
.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.btn-invoice{padding:10px 20px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:.15s}
.btn-invoice:hover{background:#1d4ed8}
.btn-invoice:disabled{background:#94a3b8;cursor:not-allowed}
.btn-done{padding:10px 20px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:.15s}
.btn-done:hover{background:#15803d}
.btn-done:disabled{background:#94a3b8;cursor:not-allowed}
.btn-delete{padding:10px 14px;background:#fff;color:#ef4444;border:2px solid #ef4444;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:.15s;margin-left:auto}
.btn-delete:hover{background:#fef2f2}
.action-msg{font-size:.85rem;padding:8px 12px;border-radius:6px;margin-top:10px;display:none}
.action-msg.ok{background:#f0fdf4;color:#15803d;display:block}
.action-msg.err{background:#fef2f2;color:#b91c1c;display:block}
.action-msg.warn{background:#fffbeb;color:#92400e;display:block}
/* ── EDIT MODE ── */
.btn-edit{padding:10px 20px;background:#f59e0b;color:#fff;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:.15s}
.btn-edit:hover{background:#d97706}
.edit-panel{margin-top:14px;background:#fffbeb;border:2px solid #f59e0b;border-radius:10px;padding:16px;display:none}
.edit-panel.open{display:block}
.edit-panel h4{font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:#92400e;margin-bottom:10px}
.edit-item-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #fde68a}
.edit-item-row:last-of-type{border-bottom:none}
.edit-item-label{flex:1;font-size:.9rem;color:#555}
.edit-qty{width:64px;padding:5px 8px;border:2px solid #fde68a;border-radius:6px;font-size:.9rem;text-align:center}
.edit-qty:focus{outline:none;border-color:#f59e0b}
.btn-rm-item{background:none;border:none;color:#ef4444;cursor:pointer;font-size:1rem;padding:3px 7px;border-radius:5px;font-weight:700}
.btn-rm-item:hover{background:#fef2f2}
.edit-actions{display:flex;gap:10px;margin-top:14px}
.btn-save-edit{padding:9px 20px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer}
.btn-save-edit:hover{background:#15803d}
.btn-cancel-edit{padding:9px 18px;background:none;border:2px solid #cbd5e1;color:#64748b;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer}
.btn-cancel-edit:hover{background:#f1f5f9}
/* ── ADD NEW ITEM IN EDIT ── */
.edit-add-section{margin-top:14px;padding-top:12px;border-top:2px dashed #fde68a}
.edit-add-title{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:#92400e;font-weight:700;margin-bottom:10px}
.edit-add-grid{display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr auto;gap:6px;align-items:center}
.edit-add-input{padding:7px 9px;border:2px solid #fde68a;border-radius:6px;font-size:.88rem;font-family:inherit;width:100%}
.edit-add-input:focus{outline:none;border-color:#f59e0b}
.btn-add-item{padding:7px 12px;background:#f59e0b;color:#fff;border:none;border-radius:6px;font-size:.88rem;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-add-item:hover{background:#d97706}
.edit-new-badge{font-size:.7rem;background:#dcfce7;color:#15803d;border-radius:4px;padding:1px 5px;font-weight:700;margin-left:4px}
@media(max-width:580px){.edit-add-grid{grid-template-columns:1fr 1fr;gap:6px}.edit-add-grid button{grid-column:span 2}}
/* ── STOCK TAB ── */
.stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stock-cat-card{background:#fff;border-radius:12px;padding:20px 16px;cursor:pointer;box-shadow:0 1px 8px rgba(0,0,0,.07);transition:.15s;text-align:center}
.stock-cat-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.12)}
.stock-product-row{background:#fff;border-radius:10px;padding:14px 18px;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;transition:.15s;margin-bottom:10px}
.stock-product-row:hover{background:#f8fafc}
.stock-breadcrumb{margin-bottom:18px;font-size:.88rem;color:#888;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stock-breadcrumb .bc-link{color:#7c3aed;cursor:pointer;font-weight:600}
.stock-breadcrumb .bc-link:hover{text-decoration:underline}
.stock-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,.07);margin-bottom:14px}
.stock-card-header{padding:13px 18px;background:#f8fafc;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between}
.stock-card-body{padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px}
.stock-size-cell{text-align:center;min-width:58px}
.stock-size-label{font-size:.73rem;color:#888;margin-bottom:5px}
.sbadge-ok {background:#dcfce7;color:#15803d;padding:3px 10px;border-radius:12px;font-size:.82rem;font-weight:700;display:inline-block}
.sbadge-low{background:#fef9c3;color:#92400e;padding:3px 10px;border-radius:12px;font-size:.82rem;font-weight:700;display:inline-block}
.sbadge-out{background:#fee2e2;color:#b91c1c;padding:3px 10px;border-radius:12px;font-size:.82rem;font-weight:700;display:inline-block}
/* ── STOCK INLINE EDIT ── */
.stock-edit-wrap{display:inline-flex;align-items:center;gap:4px}
.stock-edit-input{width:52px;padding:4px 6px;border:2px solid #7c3aed;border-radius:6px;font-size:.88rem;text-align:center;font-family:inherit;-moz-appearance:textfield}
.stock-edit-input::-webkit-outer-spin-button,.stock-edit-input::-webkit-inner-spin-button{-webkit-appearance:none}
.stock-edit-input:focus{outline:none}
.stock-edit-ok{background:#16a34a;border:none;color:#fff;padding:4px 8px;border-radius:5px;font-size:.82rem;cursor:pointer;font-weight:700}
.stock-edit-cancel{background:none;border:1px solid #cbd5e1;color:#64748b;padding:4px 7px;border-radius:5px;font-size:.82rem;cursor:pointer}
.btn-stock-edit{background:none;border:none;color:#7c3aed;cursor:pointer;font-size:.8rem;padding:2px 5px;opacity:.6;vertical-align:middle}
.btn-stock-edit:hover{opacity:1}
/* Empty/loading states */
.empty-state{text-align:center;padding:60px 20px;color:#bbb}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid #e2e8f0;border-top-color:#7c3aed;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* PDF overlay */
#emp-pdf-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:9999;overflow-y:auto;color-scheme:light}
.emp-pdf-toolbar{position:sticky;top:0;background:#1a1a2e;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;color-scheme:dark}
.emp-pdf-close{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;padding:6px 14px;border-radius:6px;font-size:.85rem;cursor:pointer}
#emp-pdf-body{max-width:640px;margin:0 auto;padding:20px;font-family:Arial,sans-serif;background:#fff;color-scheme:light}
#emp-pdf-body table{border-collapse:collapse}
@media print{
  body>*:not(#emp-pdf-overlay){display:none!important}
  #emp-pdf-overlay{display:block!important;position:static!important;height:auto!important;overflow:visible!important;background:#fff!important;z-index:auto!important;color-scheme:light!important}
  #emp-pdf-body{padding:0!important}
  .emp-pdf-toolbar{display:none!important}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
}
.loading-state{text-align:center;padding:40px;color:#888}
@media(max-width:580px){.order-date{display:none}.order-header{flex-wrap:wrap}}
</style>
</head>
<body>

<!-- ═══ LOGIN SCREEN ═══ -->
<div id="login-screen">
  <div class="login-card">
    <div style="font-size:2.5rem;margin-bottom:12px">🔐</div>
    <h1 id="biz-name-login">Employee Dashboard</h1>
    <p>Enter your password to access orders</p>
    <input type="password" id="pass-input" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-login" onclick="doLogin()">Sign In</button>
    <div class="login-err" id="login-err">Incorrect password. Please try again.</div>
  </div>
</div>

<!-- ═══ DASHBOARD ═══ -->
<div id="dashboard">
  <nav>
    <h1>📋 Employee Dashboard</h1>
    <div class="nav-right">
      <span class="stat-pill" id="nav-pending">… Pending</span>
      <button class="btn-logout" onclick="refreshOrders()" id="btn-refresh">🔄 Refresh</button>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <div class="dash-body">

    <!-- ── TOP SECTION SWITCHER ── -->
    <div style="display:flex;gap:10px;margin-bottom:16px">
      <button id="mode-orders" onclick="switchToOrders('all')"
        style="flex:1;padding:12px;background:#7c3aed;color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer">
        📋 Orders
      </button>
      <button id="mode-stock" onclick="switchToStock()"
        style="flex:1;padding:12px;background:#fff;color:#7c3aed;border:2px solid #7c3aed;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer">
        📦 Stock
      </button>
    </div>

    <!-- ── ORDER FILTER TABS ── -->
    <div class="tabs" id="tabs">
      <button class="tab active" data-filter="all"      onclick="switchToOrders('all')">All<span class="tab-count" id="cnt-all">0</span></button>
      <button class="tab" data-filter="Pending"         onclick="switchToOrders('Pending')">Pending<span class="tab-count" id="cnt-pending">0</span></button>
      <button class="tab" data-filter="Invoiced"        onclick="switchToOrders('Invoiced')">Invoiced<span class="tab-count" id="cnt-invoiced">0</span></button>
      <button class="tab" data-filter="Completed"       onclick="switchToOrders('Completed')">Completed<span class="tab-count" id="cnt-completed">0</span></button>
    </div>

    <div id="orders-container">
      <div class="loading-state"><div class="spinner"></div><br><br>Loading orders…</div>
    </div>

    <div id="stock-view" style="display:none"></div>
  </div>
</div>

<!-- PDF overlay -->
<div id="emp-pdf-overlay">
  <div class="emp-pdf-toolbar">
    <div style="display:flex;gap:8px">
      <button onclick="window.print()" style="background:#7c3aed;border:none;color:#fff;padding:8px 16px;border-radius:8px;font-size:.88rem;font-weight:700;cursor:pointer">🖨 Print</button>
      <button id="emp-share-btn" onclick="shareInvoiceText()" style="background:#25d366;border:none;color:#fff;padding:8px 16px;border-radius:8px;font-size:.88rem;font-weight:700;cursor:pointer">↗ Share</button>
    </div>
    <button class="emp-pdf-close" onclick="document.getElementById('emp-pdf-overlay').style.display='none'">✕ Close</button>
  </div>
  <div id="emp-pdf-body"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
//  API SHIM — only activates when NOT inside Google Apps Script.
//  Inside Apps Script, google.script.run is already native.
//  On Vercel (or any static host), this shim emulates it via fetch.
// ════════════════════════════════════════════════════════════════
var API_URL = 'https://script.google.com/macros/s/AKfycbyiayJs05UBqg65jl3HhyF8rqcIiuZvF6A7BKDsBcKILnw48Qz8-o-LxdqcVwgpDZRp/exec';
(function(){
  // If native google.script.run already exists, we are inside Apps Script — do nothing
  if (typeof google !== 'undefined' && google.script && google.script.run) return;
  var GET_ACTIONS = { getBusinessName:1, getInventory:1 };
  var POST_ARGS = {
    getOrders:      ['password'],
    submitOrder:    ['order'],
    sendInvoice:    ['orderId','password'],
    deleteOrder:    ['orderId','password'],
    editOrderItems: ['orderId','newItems','password'],
    markDone:       ['orderId','password']
  };
  function makeRunner(){
    var onOk=null, onErr=null;
    var runner = {
      withSuccessHandler:function(cb){ onOk=cb; return runner; },
      withFailureHandler:function(cb){ onErr=cb; return runner; }
    };
    function attach(name){
      runner[name] = function(){
        var args = arguments, req;
        if (GET_ACTIONS[name]) {
          req = fetch(API_URL + '?action=' + encodeURIComponent(name));
        } else {
          var payload = { action: name };
          (POST_ARGS[name]||[]).forEach(function(k,i){ payload[k] = args[i]; });
          req = fetch(API_URL, { method:'POST', body: JSON.stringify(payload) });
        }
        req.then(function(r){ return r.json(); })
           .then(function(res){ if (onOk) onOk(res); })
           .catch(function(err){ if (onErr) onErr(err); });
      };
    }
    Object.keys(GET_ACTIONS).forEach(attach);
    Object.keys(POST_ARGS).forEach(attach);
    return runner;
  }
  window.google = window.google || {};
  window.google.script = window.google.script || {};
  Object.defineProperty(window.google.script, 'run', { get: makeRunner });
})();

var SESSION_PASS   = '';
var ALL_ORDERS     = [];
var CURRENT_FILTER = 'all';
var STOCK_DATA     = null;

// ─── BUSINESS NAME ────────────────────────────────────────────
try {
  google.script.run.withSuccessHandler(function(n) {
    if (n) {
      document.getElementById('biz-name-login').textContent = n + ' — Dashboard';
      document.title = n + ' — Dashboard';
    }
  }).getBusinessName();
} catch(e) {}

// ─── LOGIN ────────────────────────────────────────────────────
function doLogin() {
  var pass = document.getElementById('pass-input').value;
  var errEl = document.getElementById('login-err');
  errEl.style.display = 'none';
  document.querySelector('.btn-login').textContent = 'Signing in…';

  google.script.run
    .withSuccessHandler(function(result) {
      document.querySelector('.btn-login').textContent = 'Sign In';
      if (result.success) {
        SESSION_PASS = pass;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadOrders();
      } else {
        errEl.style.display = 'block';
      }
    })
    .withFailureHandler(function() {
      document.querySelector('.btn-login').textContent = 'Sign In';
      errEl.textContent = 'Connection error. Please refresh.';
      errEl.style.display = 'block';
    })
    .getOrders(pass);
}

function refreshOrders() {
  var btn = document.getElementById('btn-refresh');
  if (btn) { btn.textContent = '⏳'; btn.disabled = true; }
  STOCK_DATA = null; // reset stock cache so stock tab also refreshes
  loadOrders();
  // Re-enable after load completes (loadOrders handles its own UI)
  setTimeout(function() {
    if (btn) { btn.textContent = '🔄 Refresh'; btn.disabled = false; }
  }, 3000);
}

function logout() {
  SESSION_PASS = ''; ALL_ORDERS = [];
  document.getElementById('pass-input').value = '';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

// ─── LOAD ORDERS ─────────────────────────────────────────────
function loadOrders() {
  document.getElementById('orders-container').innerHTML =
    '<div class="loading-state"><div class="spinner"></div><br><br>Loading orders…</div>';

  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        ALL_ORDERS = result.orders;
        updateCounts();
        renderOrders(CURRENT_FILTER);
      } else {
        document.getElementById('orders-container').innerHTML =
          '<div class="empty-state">⚠️ Error: ' + result.error + '</div>';
      }
    })
    .withFailureHandler(function(err) {
      document.getElementById('orders-container').innerHTML =
        '<div class="empty-state">⚠️ Could not load orders. Please refresh.</div>';
    })
    .getOrders(SESSION_PASS);
}

// ─── UPDATE COUNTS ────────────────────────────────────────────
function updateCounts() {
  var counts = { all: ALL_ORDERS.length, Pending:0, Invoiced:0, Completed:0 };
  ALL_ORDERS.forEach(function(o) { counts[o.status] = (counts[o.status]||0) + 1; });
  document.getElementById('cnt-all').textContent       = counts.all;
  document.getElementById('cnt-pending').textContent   = counts.Pending||0;
  document.getElementById('cnt-invoiced').textContent  = counts.Invoiced||0;
  document.getElementById('cnt-completed').textContent = counts.Completed||0;
  document.getElementById('nav-pending').textContent   = (counts.Pending||0) + ' Pending';
}

// ─── MODE SWITCHING ───────────────────────────────────────────
function setModeButtons(mode) {
  var ob = document.getElementById('mode-orders');
  var sb = document.getElementById('mode-stock');
  if (!ob || !sb) return;
  if (mode === 'stock') {
    sb.style.background = '#7c3aed'; sb.style.color = '#fff'; sb.style.border = '2px solid #7c3aed';
    ob.style.background = '#fff';    ob.style.color = '#7c3aed'; ob.style.border = '2px solid #7c3aed';
  } else {
    ob.style.background = '#7c3aed'; ob.style.color = '#fff'; ob.style.border = '2px solid #7c3aed';
    sb.style.background = '#fff';    sb.style.color = '#7c3aed'; sb.style.border = '2px solid #7c3aed';
  }
}

function switchToOrders(filter) {
  setModeButtons('orders');
  document.getElementById('stock-view').style.display       = 'none';
  document.getElementById('orders-container').style.display = 'block';
  document.getElementById('tabs').style.display             = 'flex';
  filterOrders(filter);
}

function switchToStock() {
  setModeButtons('stock');
  CURRENT_FILTER = 'stock';
  document.getElementById('tabs').style.display             = 'none';
  document.getElementById('orders-container').style.display = 'none';
  document.getElementById('stock-view').style.display       = 'block';
  if (STOCK_DATA) {
    renderStockCategories();
  } else {
    loadStockData();
  }
}

// ─── FILTER ───────────────────────────────────────────────────
function filterOrders(filter) {
  CURRENT_FILTER = filter;
  document.querySelectorAll('.tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.filter === filter);
  });
  renderOrders(filter);
}

// ─── STOCK: LOAD DATA ─────────────────────────────────────────
function loadStockData() {
  document.getElementById('stock-view').innerHTML =
    '<div class="loading-state"><div class="spinner"></div><br><br>Loading stock…</div>';
  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        STOCK_DATA = result;
        renderStockCategories();
      } else {
        document.getElementById('stock-view').innerHTML =
          '<div class="empty-state">⚠️ ' + result.error + '</div>';
      }
    })
    .withFailureHandler(function() {
      document.getElementById('stock-view').innerHTML =
        '<div class="empty-state">⚠️ Could not load stock data. Please refresh.</div>';
    })
    .getInventory();
}

// ─── STOCK: SEARCH BAR (shown on all stock levels) ───────────
function stockSearchBar() {
  return '<div style="margin-bottom:16px;position:relative">'
    + '<input type="text" id="stock-search" placeholder="🔍  Search product ID…" oninput="searchStock(this.value)"'
    + ' style="width:100%;padding:11px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:.97rem;color:#222;background:#fff;font-family:inherit">'
    + '<div id="stock-search-results" style="display:none;position:absolute;left:0;right:0;top:100%;background:#fff;border:2px solid #7c3aed;border-top:none;border-radius:0 0 10px 10px;max-height:220px;overflow-y:auto;z-index:99;box-shadow:0 6px 16px rgba(0,0,0,.12)"></div>'
    + '</div>';
}

function searchStock(q) {
  var res = document.getElementById('stock-search-results');
  if (!res || !STOCK_DATA) return;
  q = q.trim().toLowerCase();
  if (!q) { res.style.display = 'none'; return; }

  var matches = Object.keys(STOCK_DATA.inventory).filter(function(pid) {
    return pid.toLowerCase().indexOf(q) !== -1;
  });

  if (matches.length === 0) { res.innerHTML = '<div style="padding:12px 16px;color:#aaa;font-size:.9rem">No products found</div>'; res.style.display = 'block'; return; }

  res.innerHTML = matches.map(function(pid) {
    // find category
    var cat = '';
    STOCK_DATA.groups.forEach(function(g) { if (g.products.indexOf(pid) !== -1) cat = g.label; });
    return '<div onclick="selectStockProduct(\'' + esc(pid) + '\',\'' + esc(cat) + '\')" '
      + 'style="padding:11px 16px;cursor:pointer;border-bottom:1px solid #f0f2f5;font-size:.93rem" '
      + 'onmouseover="this.style.background=\'#f5f3ff\'" onmouseout="this.style.background=\'#fff\'">'
      + '<strong style="color:#1a1a2e">' + pid + '</strong>'
      + '<span style="color:#888;font-size:.82rem;margin-left:8px">' + cat + '</span>'
      + '</div>';
  }).join('');
  res.style.display = 'block';
}

function selectStockProduct(pid, cat) {
  var res = document.getElementById('stock-search-results');
  if (res) res.style.display = 'none';
  var inp = document.getElementById('stock-search');
  if (inp) inp.value = pid;
  renderStockDetail(pid, cat);
}

// ─── STOCK: LEVEL 1 — CATEGORIES ─────────────────────────────
function renderStockCategories() {
  var html = '<div class="stock-breadcrumb">📦 Stock</div>' + stockSearchBar() + '<div class="stock-grid">';
  STOCK_DATA.groups.forEach(function(g) {
    var totalSKUs = 0, inStock = 0;
    g.products.forEach(function(pid) {
      var prod = STOCK_DATA.inventory[pid];
      if (!prod) return;
      Object.keys(prod).forEach(function(color) {
        Object.keys(prod[color]).forEach(function(size) {
          totalSKUs++;
          if ((prod[color][size] || 0) > 0) inStock++;
        });
      });
    });
    var pct   = totalSKUs > 0 ? Math.round(inStock / totalSKUs * 100) : 0;
    var emoji = pct === 0 ? '🔴' : pct < 40 ? '🟡' : '🟢';
    html += '<div class="stock-cat-card" onclick="renderStockProducts(\'' + esc(g.label) + '\')">'
      + '<div style="font-size:2rem;margin-bottom:8px">' + emoji + '</div>'
      + '<div style="font-weight:700;color:#1a1a2e;margin-bottom:6px;font-size:.95rem">' + g.label + '</div>'
      + '<div style="font-size:.8rem;color:#888">' + g.products.length + ' product' + (g.products.length!==1?'s':'') + '</div>'
      + '<div style="font-size:.78rem;margin-top:6px;color:#555">' + inStock + ' / ' + totalSKUs + ' SKUs in stock</div>'
      + '</div>';
  });
  html += '</div>';
  document.getElementById('stock-view').innerHTML = html;
}

// ─── STOCK: LEVEL 2 — PRODUCTS IN CATEGORY ───────────────────
function renderStockProducts(catLabel) {
  var group = STOCK_DATA.groups.find(function(g) { return g.label === catLabel; });
  if (!group) return;
  var html = '<div class="stock-breadcrumb">'
    + '<span class="bc-link" onclick="renderStockCategories()">📦 Stock</span>'
    + ' › ' + catLabel + '</div>'
    + stockSearchBar();
  group.products.forEach(function(pid) {
    var prod = STOCK_DATA.inventory[pid];
    if (!prod) return;
    var total = 0, inStock = 0;
    Object.keys(prod).forEach(function(color) {
      Object.keys(prod[color]).forEach(function(size) {
        total++;
        if ((prod[color][size] || 0) > 0) inStock++;
      });
    });
    var badgeClass = inStock === 0 ? 'sbadge-out' : inStock < total * 0.3 ? 'sbadge-low' : 'sbadge-ok';
    var badgeText  = inStock === 0 ? 'Out of Stock' : inStock + '/' + total + ' in stock';
    html += '<div class="stock-product-row" onclick="renderStockDetail(\'' + esc(pid) + '\',\'' + esc(catLabel) + '\')">'
      + '<div><strong style="color:#1a1a2e;font-size:.97rem">' + pid + '</strong>'
      + '<div style="font-size:.8rem;color:#888;margin-top:2px">' + catLabel + '</div></div>'
      + '<div style="display:flex;align-items:center;gap:10px">'
      + '<span class="' + badgeClass + '">' + badgeText + '</span>'
      + '<span style="color:#bbb;font-size:1.1rem">›</span></div>'
      + '</div>';
  });
  document.getElementById('stock-view').innerHTML = html;
}

// ─── STOCK: LEVEL 3 — COLORS + SIZES LIST ────────────────────
function renderStockDetail(pid, catLabel) {
  var prod = STOCK_DATA.inventory[pid];
  if (!prod) return;

  var html = '<div class="stock-breadcrumb">'
    + '<span class="bc-link" onclick="renderStockCategories()">📦 Stock</span>'
    + ' › <span class="bc-link" onclick="renderStockProducts(\'' + esc(catLabel) + '\')">' + catLabel + '</span>'
    + ' › <strong style="color:#1a1a2e">' + pid + '</strong>'
    + '</div>'
    + stockSearchBar()
    + '<div style="display:flex;justify-content:flex-end;margin-bottom:14px">'

    + 'style="padding:9px 20px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer">🖨 Print / Save PDF</button>'
    + '</div>';

  Object.keys(prod).forEach(function(color) {

    var totalQty = sizeKeys.reduce(function(s, k) { return s + (parseInt(sizes[k]) || 0); }, 0);

    html += '<div class="stock-card" style="margin-bottom:12px">'
      + '<div class="stock-card-header">'
      + '<strong style="color:#1a1a2e;font-size:.97rem">' + color + '</strong>'
      + '<span style="font-size:.82rem;color:#888">' + inStock + ' sizes in stock &nbsp;·&nbsp; ' + totalQty + ' pcs total</span>'
      + '</div>'
      + '<table style="width:100%;border-collapse:collapse;font-size:.88rem">'
      + '<thead><tr style="background:#f8fafc">'
      + '<th style="padding:9px 16px;text-align:left;font-size:.75rem;text-transform:uppercase;color:#aaa;font-weight:600">Size</th>'
      + '<th style="padding:9px 16px;text-align:left;font-size:.75rem;text-transform:uppercase;color:#aaa;font-weight:600">Stock</th>'
      + '<th style="padding:9px 16px;text-align:left;font-size:.75rem;text-transform:uppercase;color:#aaa;font-weight:600">Status</th>'
      + '</tr></thead><tbody>';

    sizeKeys.forEach(function(size) {
      var stock   = parseInt(sizes[size]) || 0;
      var cls     = stock === 0 ? 'sbadge-out' : stock <= 3 ? 'sbadge-low' : 'sbadge-ok';
      var label   = stock === 0 ? 'Out of Stock' : stock <= 3 ? 'Low Stock' : 'In Stock';

        +   stock + ' pcs'
        +   '<button class="btn-stock-edit" onclick="editStockQty(\'' + esc(pid) + '\',\'' + esc(colorNum) + '\',\'' + esc(size) + '\',\'' + cellId + '\')" title="Edit stock">✎</button>'
        + '</td>'
        + '<td style="padding:10px 16px"><span class="' + cls + '" id="' + cellId + '-badge">' + label + '</span></td>'
        + '</tr>';
    });

    html += '</tbody></table></div>';
  });

// ─── STOCK INLINE EDIT ───────────────────────────────────────
function editStockQty(pid, colorNum, size, cellId) {
  var cell = document.getElementById(cellId);
  if (!cell) return;
  var current = parseInt(cell.textContent) || 0;
  cell.innerHTML =
    '<span class="stock-edit-wrap">'
    + '<input class="stock-edit-input" id="' + cellId + '-input" type="number" min="0" value="' + current + '">'
    + '<button class="stock-edit-ok" onclick="saveStockQty(\'' + esc(pid) + '\',\'' + esc(colorNum) + '\',\'' + esc(size) + '\',\'' + cellId + '\')" title="Save">✓</button>'
    + '<button class="stock-edit-cancel" onclick="cancelStockQty(\'' + cellId + '\',' + current + ')" title="Cancel">✕</button>'
    + '</span>';
  var inp = document.getElementById(cellId + '-input');
  if (inp) { inp.focus(); inp.select(); }
}

function saveStockQty(pid, colorNum, size, cellId) {
  var inp = document.getElementById(cellId + '-input');
  if (!inp) return;
  var newQty = parseInt(inp.value);
  if (isNaN(newQty) || newQty < 0) { inp.focus(); return; }

  var cell = document.getElementById(cellId);
  if (cell) cell.innerHTML = '<span style="color:#aaa;font-size:.85rem">Saving…</span>';

  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        // Update STOCK_DATA in memory
        var colorKey = 'Color ' + colorNum;
        if (STOCK_DATA && STOCK_DATA.inventory && STOCK_DATA.inventory[pid] && STOCK_DATA.inventory[pid][colorKey]) {
          STOCK_DATA.inventory[pid][colorKey][size] = newQty;
        }
        // Update cell display
        var cls   = newQty === 0 ? 'sbadge-out' : newQty <= 3 ? 'sbadge-low' : 'sbadge-ok';
        var label = newQty === 0 ? 'Out of Stock' : newQty <= 3 ? 'Low Stock' : 'In Stock';
        var c = document.getElementById(cellId);
        if (c) c.innerHTML = newQty + ' pcs <button class="btn-stock-edit" onclick="editStockQty(\'' + esc(pid) + '\',\'' + esc(colorNum) + '\',\'' + esc(size) + '\',\'' + cellId + '\')" title="Edit stock">✎</button>';
        var badge = document.getElementById(cellId + '-badge');
        if (badge) { badge.className = cls; badge.textContent = label; }
      } else {
        var c2 = document.getElementById(cellId);
        if (c2) c2.innerHTML = '⚠ Error <button class="btn-stock-edit" onclick="editStockQty(\'' + esc(pid) + '\',\'' + esc(colorNum) + '\',\'' + esc(size) + '\',\'' + cellId + '\')">Retry</button>';
      }
    })
    .withFailureHandler(function() {
      var c3 = document.getElementById(cellId);
      if (c3) c3.innerHTML = '⚠ Failed <button class="btn-stock-edit" onclick="editStockQty(\'' + esc(pid) + '\',\'' + esc(colorNum) + '\',\'' + esc(size) + '\',\'' + cellId + '\')">Retry</button>';
    })
    .updateStockQty(pid, colorNum, size, newQty, SESSION_PASS);
}

function cancelStockQty(cellId, original) {
  var c = document.getElementById(cellId);
  var parts = cellId.replace('sqty-','').split('-');
  var pid      = parts[0];
  var colorNum = parts[1];
  var size     = parts[2];
  if (c) c.innerHTML = original + ' pcs <button class="btn-stock-edit" onclick="editStockQty(\'' + esc(pid) + '\',\'' + esc(colorNum) + '\',\'' + esc(size) + '\',\'' + cellId + '\')" title="Edit stock">✎</button>';
}

// ─── PRINT STOCK DETAIL ───────────────────────────────────────
function printStockDetail(pid, catLabel) {
  var prod = STOCK_DATA.inventory[pid];
  if (!prod) return;

  var now  = new Date();
  var date = now.getDate() + '/' + (now.getMonth()+1) + '/' + now.getFullYear();

  var colorSections = '';
  Object.keys(prod).forEach(function(color) {
    var sizes    = prod[color];
    var sizeKeys = Object.keys(sizes);
    var totalQty = sizeKeys.reduce(function(s, k) { return s + (parseInt(sizes[k]) || 0); }, 0);

    var rows = sizeKeys.map(function(size) {

        + '<td style="padding:9px 14px;border-bottom:1px solid #ddd;font-weight:700;color:#111">' + size + '</td>'
        + '<td style="padding:9px 14px;border-bottom:1px solid #ddd;color:#333">' + stock + ' pcs</td>'
        + '<td style="padding:9px 14px;border-bottom:1px solid #ddd"><span style="' + statusStyle + '">' + label + '</span></td>'
        + '</tr>';
    }).join('');

    colorSections += '<div style="margin-bottom:22px;break-inside:avoid">'
      + '<div style="background:#1a1a2e;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center">'
      + '<strong style="color:#fff">' + color + '</strong>'
      + '<span style="font-size:.82rem;color:#fff;opacity:.85">' + totalQty + ' pcs total</span>'
      + '</div>'
      + '<table style="width:100%;border-collapse:collapse;font-size:.9rem;border:1px solid #ddd;border-top:none">'
      + '<thead><tr style="background:#f0f0f0">'
      + '<th style="padding:8px 14px;text-align:left;font-size:.75rem;text-transform:uppercase;color:#333;border-bottom:1px solid #ddd">Size</th>'
      + '<th style="padding:8px 14px;text-align:left;font-size:.75rem;text-transform:uppercase;color:#333;border-bottom:1px solid #ddd">Stock</th>'
      + '<th style="padding:8px 14px;text-align:left;font-size:.75rem;text-transform:uppercase;color:#333;border-bottom:1px solid #ddd">Status</th>'
      + '</tr></thead><tbody>' + rows + '</tbody></table>'
      + '</div>';
  });

  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8">'
    + '<title>Stock — ' + pid + '</title>'
    + '<style>'
    + '*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}'
    + 'body{font-family:Arial,sans-serif;padding:28px;color:#111;background:#fff}'
    + '.print-btn{display:block;margin:24px auto 0;padding:10px 30px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;font-size:.95rem;cursor:pointer}'
    + '@media print{.print-btn{display:none}}'
    + '</style></head><body>'
    + '<div style="background:#1a1a2e;color:#fff;padding:24px 28px;border-radius:10px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center">'
    +   '<div><div style="font-size:1.4rem;font-weight:700;color:#fff">Burmelin — Stock List</div>'
    +   '<div style="font-size:.85rem;color:rgba(255,255,255,.75);margin-top:4px">' + catLabel + ' › Product: ' + pid + '</div></div>'
    +   '<div style="font-size:.85rem;color:rgba(255,255,255,.75)">Date: ' + date + '</div>'
    + '</div>'
    + colorSections
    + '<button class="print-btn" onclick="window.print()">🖨 Print / Save as PDF</button>'

  mobileprint(html);

// ─── MOBILE-SAFE PDF OVERLAY ──────────────────────────────────
function mobileprint(html) {
  // Extract style tags so CSS travels with the content
  var styleMatch = html.match(/<style[^>]*>[\s\S]*?<\/style>/gi);
  var styles = styleMatch ? styleMatch.join('') : '';

  // Extract body content
  var bodyMatch = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
  var content   = bodyMatch ? bodyMatch[1] : html;
  content = content.replace(/<button[^>]*class="print-btn"[^>]*>[\s\S]*?<\/button>/gi, '');

  document.getElementById('emp-pdf-body').innerHTML = styles + content;
  document.getElementById('emp-pdf-overlay').style.display = 'block';
  window.scrollTo(0, 0);
}

function esc(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

// ─── RENDER ORDERS ────────────────────────────────────────────
function renderOrders(filter) {
  var list = filter === 'all' ? ALL_ORDERS : ALL_ORDERS.filter(function(o){ return o.status===filter; });
  var container = document.getElementById('orders-container');

  if (list.length === 0) {
    container.innerHTML = '<div class="empty-state">📭 No ' + (filter==='all'?'':filter.toLowerCase()+' ') + 'orders found.</div>';
    return;
  }

  container.innerHTML = list.map(function(order) {
    return buildOrderCard(order);
  }).join('');
}

// ─── BUILD ORDER CARD ─────────────────────────────────────────
function buildOrderCard(order) {
  var statusClass = 'status-' + order.status.toLowerCase();
  var itemRows = (order.items||[]).map(function(item) {
    return '<tr><td><strong>' + item.product + '</strong></td><td>' + item.color + '</td><td>' + item.size + '</td>'
          + '<td><span class="qty-badge">' + item.qty + '</span></td></tr>';
  }).join('');

  var invoiceBtn = '';
  var doneBtn    = '';
  var alreadyDone = order.status === 'Completed';

  var editBtn   = '';
  var deleteBtn = '<button class="btn-delete" onclick="doDeleteOrder(\'' + order.orderId + '\')">🗑 Delete</button>';

  // Print invoice is always available regardless of status
  invoiceBtn = '<button class="btn-invoice" id="inv-' + order.orderId + '" onclick="printInvoice(\'' + order.orderId + '\')">🖨 Print Invoice</button>';

  if (!alreadyDone) {
    doneBtn = '<button class="btn-done" id="done-' + order.orderId + '" onclick="markDone(\'' + order.orderId + '\')">'
      + '✔ Mark as Done</button>';
    editBtn = '<button class="btn-edit" onclick="toggleEdit(\'' + order.orderId + '\')">✏ Edit Items</button>';
  } else {
    doneBtn = '<button class="btn-done" disabled>✔ Completed</button>';
  }

  // Build edit panel rows — store full item data as data-attributes so saveEdit
  // can read everything without needing to look up order.items by index
  var editRows = (order.items||[]).map(function(item, idx) {
    return '<div class="edit-item-row" id="edit-row-' + order.orderId + '-' + idx + '"'
      + ' data-prod="' + item.product + '" data-color="' + item.color + '" data-size="' + item.size + '"'
      + ' data-lp="' + (item.lp||item.product) + '" data-lc="' + (item.lc||item.color.replace('Color ','')) + '" data-ls="' + (item.ls||item.size) + '">'
      + '<span class="edit-item-label"><strong>' + item.product + '</strong> · ' + item.color + ' · Size ' + item.size + '</span>'
      + '<input class="edit-qty" type="number" min="1" max="999" value="' + item.qty + '">'
      + '<button class="btn-rm-item" onclick="removeEditItem(\'' + order.orderId + '\',' + idx + ')" title="Remove this item">✕</button>'
      + '</div>';
  }).join('');

  return '<div class="order-card" id="card-' + order.orderId + '">'
    + '<div class="order-header" onclick="toggleCard(\'' + order.orderId + '\')">'
    +   '<div class="order-id">' + order.orderId + '</div>'
    +   '<div class="order-customer"><strong>' + order.customerName + '</strong>'
    +     (order.customerPhone ? ' · ' + order.customerPhone : '') + '</div>'
    +   '<div class="order-date">' + order.date + '</div>'
    +   '<span class="status-badge ' + statusClass + '">' + order.status + '</span>'
    +   '<span class="expand-icon">▾</span>'
    + '</div>'
    + '<div class="order-body" id="body-' + order.orderId + '">'
    +   '<div class="customer-info">'
    +     '<div class="info-item"><label>Email</label><span>' + (order.customerEmail||'—') + '</span></div>'
    +     '<div class="info-item"><label>Phone</label><span>' + (order.customerPhone||'—') + '</span></div>'
    +     '<div class="info-item"><label>Total Items</label><span>' + order.totalQty + '</span></div>'
    +     '<div class="info-item"><label>Status</label><span>' + order.status + '</span></div>'
    +     (order.invoiceSent ? '<div class="info-item"><label>Invoice Sent</label><span>' + order.invoiceSent + '</span></div>' : '')
    +     (order.completed   ? '<div class="info-item"><label>Completed</label><span>' + order.completed + '</span></div>' : '')
    +   '</div>'
    +   '<table><thead><tr><th>Product</th><th>Color</th><th>Size</th><th>Qty</th></tr></thead>'
    +   '<tbody>' + itemRows + '</tbody></table>'
    +   (order.notes ? '<div class="notes-box"><strong>📝 Notes:</strong> ' + order.notes + '</div>' : '')
    +   '<div class="actions">' + invoiceBtn + doneBtn + editBtn + deleteBtn + '</div>'
    +   '<div class="edit-panel" id="edit-panel-' + order.orderId + '">'
    +     '<h4>✏ Edit Items — remove or adjust quantities before marking done</h4>'
    +     '<div id="edit-rows-' + order.orderId + '">' + editRows + '</div>'
    +     '<div class="edit-add-section">'
    +       '<div class="edit-add-title">＋ Add New Item</div>'
    +       '<div class="edit-add-grid">'
    +         '<input class="edit-add-input" type="text" id="add-prod-' + order.orderId + '" placeholder="Product ID" autocomplete="off">'
    +         '<input class="edit-add-input" type="text" id="add-color-' + order.orderId + '" placeholder="Color No." autocomplete="off">'
    +         '<input class="edit-add-input" type="text" id="add-size-' + order.orderId + '" placeholder="Size" autocomplete="off">'
    +         '<input class="edit-add-input" type="number" id="add-qty-' + order.orderId + '" placeholder="Qty" min="1">'
    +         '<button class="btn-add-item" onclick="addItemToEdit(\'' + order.orderId + '\')">Add</button>'
    +       '</div>'
    +       '<div id="add-item-err-' + order.orderId + '" style="color:#b91c1c;font-size:.8rem;margin-top:5px;display:none"></div>'
    +     '</div>'
    +     '<div class="edit-actions">'
    +       '<button class="btn-save-edit" onclick="saveEdit(\'' + order.orderId + '\')">💾 Save Changes</button>'
    +       '<button class="btn-cancel-edit" onclick="toggleEdit(\'' + order.orderId + '\')">Cancel</button>'
    +     '</div>'
    +   '</div>'
    +   '<div class="action-msg" id="msg-' + order.orderId + '"></div>'
    + '</div>'
    + '</div>';
}

// ─── TOGGLE CARD ─────────────────────────────────────────────
function toggleCard(orderId) {
  var body = document.getElementById('body-' + orderId);
  var card = document.getElementById('card-' + orderId);
  var isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  card.querySelector('.order-header').classList.toggle('expanded', !isOpen);
}

// ─── GROUP ITEMS BY PRODUCT ──────────────────────────────────
function groupItemsByProduct(items) {
  var map = {}, order = [];
  (items||[]).forEach(function(i) {
    if (!map[i.product]) { map[i.product] = []; order.push(i.product); }
    map[i.product].push(i);
  });
  return order.map(function(pid) { return { product: pid, items: map[pid] }; });
}

function buildGroupedInvoiceRows(items) {
  var groups = groupItemsByProduct(items);
  var html = '';
  groups.forEach(function(g) {
    var groupQty = g.items.reduce(function(s,i){ return s+i.qty; }, 0);
    html += '<tr><td colspan="4" style="padding:10px 12px 6px;background:#f0f2f5;font-weight:700;color:#1a1a2e;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;border-top:2px solid #ddd">' + g.product + '</td></tr>';
    g.items.forEach(function(i) {
      html += '<tr>'
        + '<td style="padding:7px 12px 7px 22px;color:#555;border-bottom:1px solid #f0f0f0;font-size:.88rem">' + i.color + '</td>'
        + '<td style="padding:7px 12px;color:#555;border-bottom:1px solid #f0f0f0;font-size:.88rem">' + i.size + '</td>'
        + '<td style="padding:7px 12px;border-bottom:1px solid #f0f0f0" colspan="1"></td>'
        + '<td style="padding:7px 12px;border-bottom:1px solid #f0f0f0;text-align:right;font-weight:600;color:#333;font-size:.88rem">' + i.qty + '</td>'
        + '</tr>';
    });
    html += '<tr><td colspan="3" style="padding:6px 12px 10px 22px;font-size:.78rem;color:#999">Subtotal</td>'
      + '<td style="padding:6px 12px 10px;text-align:right;font-weight:700;color:#1a1a2e;border-bottom:2px solid #ddd;font-size:.9rem">' + groupQty + ' pcs</td></tr>';
  });
  return html;
}

// ─── PRINT INVOICE ───────────────────────────────────────────
function printInvoice(orderId) {
  var order = ALL_ORDERS.find(function(o) { return o.orderId === orderId; });
  if (!order) return;

  var rows = buildGroupedInvoiceRows(order.items);

  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8">'
    + '<title>Invoice — ' + order.orderId + '</title>'
    + '<style>'
    + '*{box-sizing:border-box;margin:0;padding:0}'
    + 'body{font-family:Arial,sans-serif;padding:28px;color:#111;background:#fff;max-width:640px;margin:0 auto}'
    + '.meta{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:.9rem}'
    + '.meta td{padding:5px 0;color:#333}.meta td:first-child{color:#666;width:120px}'
    + 'table.items{width:100%;border-collapse:collapse;font-size:.9rem;border:1px solid #ddd}'
    + 'table.items th{background:#f0f0f0;padding:9px 12px;text-align:left;font-size:.75rem;text-transform:uppercase;color:#333;border-bottom:1px solid #ddd}'
    + 'table.items td{padding:10px 12px;border-bottom:1px solid #ddd;color:#111}'
    + '.total{border:1px solid #ddd;border-top:none;padding:12px;display:flex;justify-content:space-between;background:#f9f9f9;font-size:.95rem;color:#111}'
    + '.notes{margin-top:14px;padding:11px 13px;border:1px solid #ddd;border-left:4px solid #d97706;font-size:.88rem;color:#333}'
    + '.print-btn{display:block;margin:20px auto 0;padding:10px 30px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;font-size:.95rem;cursor:pointer}'
    + '@media print{.print-btn{display:none}}'
    + '</style></head><body>'
    /* ── PRINT-SAFE HEADER ── */
    + '<div style="border-bottom:3px solid #1a1a2e;padding-bottom:14px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end">'
    +   '<div><div style="font-size:1.5rem;font-weight:900;color:#1a1a2e">Burmelin</div>'
    +   '<div style="font-size:.85rem;color:#555;margin-top:2px">Order Invoice</div></div>'
    +   '<div style="text-align:right;font-size:.82rem;color:#555">' + order.date + '</div>'
    + '</div>'
    + '<table class="meta">'
    + '<tr><td>Order ID</td><td><strong>' + order.orderId + '</strong></td></tr>'
    + '<tr><td>Customer</td><td><strong>' + order.customerName + '</strong></td></tr>'
    + (order.customerPhone ? '<tr><td>Phone</td><td>' + order.customerPhone + '</td></tr>' : '')
    + '</table>'
    + '<div style="font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:#555;margin-bottom:6px;font-weight:600">Order Items</div>'
    + '<table class="items"><thead><tr><th colspan="2">Color</th><th>Size</th><th style="text-align:right">Qty</th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table>'
    + '<div class="total" style="background:#1a1a2e;color:#fff;font-weight:700;font-size:.95rem"><span>TOTAL</span><strong>' + order.totalQty + ' pcs</strong></div>'
    + (order.notes ? '<div class="notes"><strong>Notes:</strong> ' + order.notes + '</div>' : '')
    + '<button class="print-btn" onclick="window.print()">🖨 Print / Save as PDF</button>'
    + '</body></html>';

  // Printing is just a print — it does NOT change the order status.
  mobileprint(html);
}

// ─── DELETE ORDER ─────────────────────────────────────────────
function doDeleteOrder(orderId) {
  if (!confirm('Delete order ' + orderId + '?\n\nThis will permanently remove it from the system.')) return;

  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        // Remove from local list and re-render
        ALL_ORDERS = ALL_ORDERS.filter(function(o) { return o.orderId !== orderId; });
        updateCounts();
        renderOrders(CURRENT_FILTER);
      } else {
        alert('❌ Could not delete: ' + result.error);
      }
    })
    .withFailureHandler(function() {
      alert('❌ Connection error. Please try again.');
    })
    .deleteOrder(orderId, SESSION_PASS);
}

// ─── EDIT ITEMS ──────────────────────────────────────────────
function toggleEdit(orderId) {
  var panel = document.getElementById('edit-panel-' + orderId);
  panel.classList.toggle('open');
}

function removeEditItem(orderId, idx) {
  var row = document.getElementById('edit-row-' + orderId + '-' + idx);
  if (row) row.style.display = 'none';
}

function addItemToEdit(orderId) {
  var prodEl  = document.getElementById('add-prod-'  + orderId);
  var colorEl = document.getElementById('add-color-' + orderId);
  var sizeEl  = document.getElementById('add-size-'  + orderId);
  var qtyEl   = document.getElementById('add-qty-'   + orderId);
  var errEl   = document.getElementById('add-item-err-' + orderId);

  var prod  = prodEl.value.trim().toUpperCase();
  var color = colorEl.value.trim();
  var size  = sizeEl.value.trim();
  var qty   = parseInt(qtyEl.value) || 0;

  if (!prod || !color || !size || qty <= 0) {
    errEl.textContent = '⚠ Please fill in Product ID, Color, Size and Qty.';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  // Normalize color: "17" → "Color 17", "Color 17" stays as-is
  if (/^\d+$/.test(color)) color = 'Color ' + color;
  var lc = color.replace(/^Color\s*/i, '');

  var rowId  = 'edit-row-' + orderId + '-new-' + Date.now();
  var newRow = document.createElement('div');
  newRow.className = 'edit-item-row';
  newRow.id = rowId;
  newRow.setAttribute('data-prod',  prod);
  newRow.setAttribute('data-color', color);
  newRow.setAttribute('data-size',  size);
  newRow.setAttribute('data-lp',    prod);
  newRow.setAttribute('data-lc',    lc);
  newRow.setAttribute('data-ls',    size);
  newRow.innerHTML =
    '<span class="edit-item-label"><strong>' + prod + '</strong> · ' + color + ' · Size ' + size
    + ' <span class="edit-new-badge">NEW</span></span>'
    + '<input class="edit-qty" type="number" min="1" max="999" value="' + qty + '">'
    + '<button class="btn-rm-item" onclick="this.closest(\'.edit-item-row\').style.display=\'none\'" title="Remove">✕</button>';

  document.getElementById('edit-rows-' + orderId).appendChild(newRow);
  prodEl.value=''; colorEl.value=''; sizeEl.value=''; qtyEl.value='';
  prodEl.focus();
}

function saveEdit(orderId) {
  var order = ALL_ORDERS.find(function(o) { return o.orderId === orderId; });
  if (!order) return;

  // Read ALL rows (existing + newly added) from the DOM
  var newItems = [];
  var rows = document.querySelectorAll('#edit-rows-' + orderId + ' .edit-item-row');
  rows.forEach(function(row) {
    if (row.style.display === 'none') return; // removed
    var qtyInput = row.querySelector('.edit-qty');
    var qty = Math.max(1, parseInt(qtyInput ? qtyInput.value : 1) || 1);
    var prod  = row.getAttribute('data-prod');
    var color = row.getAttribute('data-color');
    var size  = row.getAttribute('data-size');
    var lp    = row.getAttribute('data-lp') || prod;
    var lc    = row.getAttribute('data-lc') || color.replace('Color ','');
    var ls    = row.getAttribute('data-ls') || size;
    if (prod && color && size) {
      newItems.push({ product: prod, color: color, size: size, qty: qty, lookupType: 'main', lp: lp, lc: lc, ls: ls });
    }
  });

  if (newItems.length === 0) {
    alert('You must keep at least one item in the order.');
    return;
  }

  var msg = document.getElementById('msg-' + orderId);
  msg.className = 'action-msg'; msg.style.display = 'none';

  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        order.items    = newItems;
        order.totalQty = result.totalQty;
        // Re-render card in place
        var card = document.getElementById('card-' + orderId);
        card.outerHTML = buildOrderCard(order);
        // Re-open the card body so the employee sees the result
        var body = document.getElementById('body-' + orderId);
        if (body) { body.classList.add('open'); document.getElementById('card-' + orderId).querySelector('.order-header').classList.add('expanded'); }
        var m = document.getElementById('msg-' + orderId);
        if (m) { m.className = 'action-msg ok'; m.textContent = '✅ Order items updated successfully.'; }
      } else {
        msg.className = 'action-msg err'; msg.textContent = '❌ ' + result.error;
      }
    })
    .withFailureHandler(function() {
      msg.className = 'action-msg err'; msg.textContent = '❌ Connection error. Please try again.';
    })
    .editOrderItems(orderId, newItems, SESSION_PASS);
}

// ─── MARK DONE ───────────────────────────────────────────────
// Track in-progress markDone calls to prevent any double execution
var MARKING_DONE = {};

function markDone(orderId) {
  // Prevent double click at JS level
  if (MARKING_DONE[orderId]) return;
  if (!confirm('Mark this order as DONE?\n\nThis will:\n• Deduct stock from your Google Sheet\n• Close the order\n\nThis cannot be undone.')) return;

  MARKING_DONE[orderId] = true;

  // Always re-query the button from the DOM — captured references go stale
  function getBtn() { return document.getElementById('done-' + orderId); }
  function getMsg() { return document.getElementById('msg-' + orderId); }

  var b = getBtn(), m = getMsg();
  if (b) { b.disabled = true; b.textContent = '⏳ Processing…'; }
  if (m) { m.className = 'action-msg'; m.style.display = 'none'; }

  google.script.run
    .withSuccessHandler(function(result) {
      delete MARKING_DONE[orderId];
      var b2 = getBtn(), m2 = getMsg();

      if (result.success) {
        // Update local order state first
        var order = ALL_ORDERS.find(function(o){ return o.orderId === orderId; });
        if (order) { order.status = 'Completed'; order.completed = 'Just now'; }
        updateCounts();

        // Re-render this card so all buttons update correctly
        if (order) {
          var card = document.getElementById('card-' + orderId);
          if (card) {
            card.outerHTML = buildOrderCard(order);
            // Re-open expanded state
            var body = document.getElementById('body-' + orderId);
            var hdr  = document.getElementById('card-' + orderId);
            if (body) body.classList.add('open');
            if (hdr)  hdr.querySelector('.order-header').classList.add('expanded');
          }
        }

        // Show result message
        var m3 = getMsg();
        if (m3) {
          if (result.alreadyCompleted) {
            m3.className = 'action-msg warn';
            m3.textContent = '⚠ This order was already completed — stock was NOT deducted again.';
          } else if (result.warnings && result.warnings.length > 0) {
            m3.className = 'action-msg warn';
            m3.textContent = '⚠ Done, but some items not found in sheet: ' + result.warnings.join('; ');
          } else {
            m3.className = 'action-msg ok';
            m3.textContent = '✅ Order completed and stock updated in Google Sheet!';
          }
        }
      } else {
        // On server error: re-enable the button with clear message
        if (b2) { b2.disabled = false; b2.textContent = '✔ Mark as Done'; }
        if (m2) { m2.className = 'action-msg err'; m2.textContent = '❌ ' + result.error; }
      }
    })
    .withFailureHandler(function() {
      delete MARKING_DONE[orderId];
      // Connection failed — re-enable but warn employee to check before retrying
      var b4 = getBtn(), m4 = getMsg();
      if (b4) { b4.disabled = false; b4.textContent = '✔ Mark as Done'; }
      if (m4) { m4.className = 'action-msg warn'; m4.textContent = '⚠ Connection lost. Please refresh orders before clicking again to avoid double deduction.'; }
    })
    .markDone(orderId, SESSION_PASS);
}
