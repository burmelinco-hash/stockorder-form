<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<title>Bicasso Staff</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;color:#222;overflow:hidden;height:100vh}

/* ── LOGIN SCREEN ── */
#screen-login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#1a1a2e 0%,#16213e 55%,#0f3460 100%);padding:24px 20px;z-index:100}
.login-brand{text-align:center;margin-bottom:24px}
.login-logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-size:2rem;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;box-shadow:0 8px 28px rgba(79,70,229,.5)}
.login-brand h1{color:#fff;font-size:1.5rem;font-weight:800}
.login-brand p{color:rgba(255,255,255,.55);font-size:.85rem;margin-top:3px}
.login-card{width:100%;max-width:340px;background:rgba(255,255,255,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:26px 20px}
.login-label{display:block;font-size:.78rem;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.login-select,.login-input{width:100%;padding:12px 14px;border:2px solid rgba(255,255,255,.15);border-radius:10px;font-size:.97rem;color:#fff;background:rgba(255,255,255,.07);font-family:inherit;margin-bottom:14px;-webkit-appearance:none}
.login-select option{background:#1a1a2e;color:#fff}
.login-select:focus,.login-input:focus{outline:none;border-color:#4f46e5;background:rgba(79,70,229,.15)}
.login-btn{width:100%;padding:14px;background:#4f46e5;color:#fff;border:none;border-radius:11px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:4px;transition:background .2s}
.login-btn:hover{background:#4338ca}
.login-err{color:#fca5a5;font-size:.83rem;margin-top:10px;text-align:center;min-height:20px}

/* ── APP SHELL ── */
#screen-app{position:fixed;inset:0;display:none;flex-direction:column;background:#f0f2f5}
#screen-app.active{display:flex}
#app-topbar{flex-shrink:0;background:#1a1a2e;display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:calc(52px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.app-store-label{color:#fff;font-size:.95rem;font-weight:700}
.app-store-tag{background:rgba(79,70,229,.6);color:#c7d2fe;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:7px;text-transform:uppercase;letter-spacing:.04em}
.btn-logout{background:none;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.7);padding:6px 13px;border-radius:7px;font-size:.8rem;cursor:pointer}
.btn-logout:hover{border-color:rgba(255,255,255,.6);color:#fff}
.btn-back{background:none;border:none;color:#fff;font-size:1.25rem;padding:6px 10px 6px 4px;cursor:pointer;line-height:1;opacity:.8}
.btn-back:hover{opacity:1}
.btn-refresh{background:none;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.7);padding:6px 10px;border-radius:7px;font-size:1rem;cursor:pointer;line-height:1}
.btn-refresh:hover{border-color:rgba(255,255,255,.6);color:#fff}
.btn-refresh.spinning{animation:spin .6s linear infinite}
#app-body{flex:1;overflow:hidden;position:relative}
.panel{position:absolute;inset:0;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.panel.active{display:block}

/* ── BOTTOM NAV ── */
#app-nav{flex-shrink:0;display:grid;grid-template-columns:1fr 1fr 1fr;background:#fff;border-top:1px solid #e8eaf0;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 8px 9px;background:none;border:none;color:#aab0c0;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;transition:color .15s}
.nav-btn.active{color:#4f46e5}
.nav-icon{font-size:1.3rem;line-height:1}

/* ── MY STORE PANEL ── */
.panel-inner{padding:14px}
.ms-tabs{display:flex;background:#fff;border-radius:12px;padding:5px;gap:3px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.mstab{flex:1;padding:10px 4px;background:none;border:none;border-radius:9px;font-size:.8rem;font-weight:700;color:#aaa;cursor:pointer;transition:.15s}
.mstab.active{background:#1a1a2e;color:#fff}

/* ── STORES PANEL ── */
.stores-header{padding:14px 14px 6px;font-size:.8rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.05em}

/* ── ORDER PANEL ── */
.order-banner{background:#1a1a2e;color:#fff;padding:12px 16px;font-size:.88rem;border-radius:12px;margin:14px 14px 12px;text-align:center}
.order-panel-inner{padding:0 14px 14px}
#order-success{display:none;text-align:center;padding:40px 20px;background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin:14px}
.success-icon{font-size:3rem;margin-bottom:14px}
#order-success h2{font-size:1.4rem;color:#15803d;margin-bottom:8px}
#order-success p{color:#555;margin-bottom:5px;font-size:.93rem}
.order-id-badge{display:inline-block;background:#f0fdf4;border:2px solid #22c55e;color:#15803d;padding:7px 18px;border-radius:8px;font-weight:700;font-size:.97rem;margin:10px 0}
.btn-new{background:none;border:2px solid #4f46e5;color:#4f46e5;padding:9px 22px;border-radius:8px;font-size:.92rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.2s}
.btn-new:hover{background:#4f46e5;color:#fff}

/* ── FORM CARDS (Order) ── */
.card{background:#fff;border-radius:14px;padding:20px 16px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:14px}
.card h2{font-size:.88rem;font-weight:700;color:#1a1a2e;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid #f0f2f5;text-transform:uppercase;letter-spacing:.04em}
.form-group{margin-bottom:14px}
label{display:block;font-size:.78rem;font-weight:600;color:#555;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=email],input[type=tel],input[type=number],select,textarea{width:100%;padding:11px 13px;border:2px solid #e2e8f0;border-radius:8px;font-size:.97rem;color:#222;background:#fafafa;transition:border-color .2s;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#4f46e5;background:#fff}
select:disabled{opacity:.45;cursor:not-allowed}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.avail-box{margin:14px 0 12px;padding:12px 14px;border-radius:10px;font-size:.9rem;font-weight:500;display:flex;align-items:center;gap:8px}
.avail-box.idle{background:#f8fafc;border:2px solid #cbd5e1;color:#64748b}
.avail-box.ok{background:#f0fdf4;border:2px solid #22c55e;color:#15803d}
.avail-box.no{background:#fef2f2;border:2px solid #ef4444;color:#b91c1c}
.avail-icon{font-size:1.2rem;flex-shrink:0}
.btn-add{width:100%;padding:12px;background:#4f46e5;color:#fff;border:none;border-radius:10px;font-size:.97rem;font-weight:600;cursor:pointer;transition:background .2s}
.btn-add:hover{background:#4338ca}
.btn-add:disabled{background:#94a3b8;cursor:not-allowed}

/* Cart */
table{width:100%;border-collapse:collapse;font-size:.88rem}
thead th{background:#f8fafc;padding:8px 10px;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:#888;border-bottom:2px solid #e2e8f0}
tbody td{padding:9px 10px;border-bottom:1px solid #f0f2f5;color:#333}
tbody tr:last-child td{border-bottom:none}
.btn-rm{background:none;border:none;color:#ef4444;cursor:pointer;font-size:.92rem;padding:2px 6px;border-radius:4px}
.btn-rm:hover{background:#fef2f2}
.total-row td{font-weight:700;background:#f8fafc;border-top:2px solid #e2e8f0!important}
.empty-msg{text-align:center;color:#bbb;padding:16px 0;font-size:.9rem}
.btn-submit{width:100%;padding:14px;background:#16a34a;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:background .2s;margin-top:4px}
.btn-submit:hover{background:#15803d}
.btn-submit:disabled{background:#94a3b8;cursor:not-allowed}
.loading-bar{display:none;text-align:center;padding:12px;color:#4f46e5;font-weight:500;font-size:.9rem}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid #c7d2fe;border-top-color:#4f46e5;border-radius:50%;animation:spin .7s linear infinite;margin-right:7px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* Mode toggle */
.mode-toggle{display:flex;gap:7px}
.mode-btn{padding:6px 15px;border-radius:8px;border:2px solid #4f46e5;background:#fff;color:#4f46e5;font-size:.82rem;font-weight:700;cursor:pointer;transition:.15s}
.mode-btn.active{background:#4f46e5;color:#fff}

/* Grid mode */
.grid-product-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:9px 12px;background:#f0f2f5;border-radius:8px}
.grid-product-name{font-size:1rem;font-weight:700;color:#1a1a2e}
.btn-change-prod{background:none;border:none;color:#4f46e5;font-size:.82rem;font-weight:600;cursor:pointer;padding:3px 7px;border-radius:5px}
.btn-change-prod:hover{background:#e0e7ff}
.grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px;border:1px solid #e2e8f0;border-radius:10px}
.grid-table{border-collapse:collapse;font-size:.83rem;width:100%}
.grid-th-color{min-width:84px;padding:8px 10px;text-align:left;font-size:.7rem;text-transform:uppercase;color:#888;background:#f8fafc;position:sticky;left:0;z-index:2;border-bottom:2px solid #e2e8f0}
.grid-th-size{min-width:50px;padding:8px 6px;text-align:center;font-size:.83rem;font-weight:700;color:#1a1a2e;background:#f8fafc;border-bottom:2px solid #e2e8f0;border-left:1px solid #f0f2f5}
.grid-td-color{padding:7px 10px;font-size:.85rem;font-weight:600;color:#1a1a2e;white-space:nowrap;background:#fff;position:sticky;left:0;z-index:1;border-bottom:1px solid #f0f2f5;border-right:2px solid #e2e8f0}
.grid-td-cell{padding:4px 3px;border-bottom:1px solid #f0f2f5;border-left:1px solid #f0f2f5;text-align:center}
.grid-cell{width:44px;padding:5px 2px;border:2px solid #e2e8f0;border-radius:6px;font-size:.9rem;text-align:center;font-family:inherit;-moz-appearance:textfield;background:#fafafa}
.grid-cell::-webkit-outer-spin-button,.grid-cell::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.grid-cell:focus{outline:none;border-color:#4f46e5;background:#fff}
.grid-cell.filled{border-color:#22c55e;background:#f0fdf4;font-weight:700;color:#15803d}
.grid-cell-out{width:44px;padding:5px 2px;border:2px solid #f0f2f5;border-radius:6px;font-size:.85rem;text-align:center;background:#f8fafc;color:#ddd;cursor:not-allowed}
.btn-add-grid{width:100%;padding:12px;background:#4f46e5;color:#fff;border:none;border-radius:10px;font-size:.97rem;font-weight:600;cursor:pointer;transition:.2s;margin-top:3px}
.btn-add-grid:hover{background:#4338ca}

/* My Stock */
.rs-search{width:100%;padding:10px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:.95rem;font-family:inherit;margin-bottom:12px}
.rs-search:focus{outline:none;border-color:#4f46e5}
.rs-badge{padding:3px 8px;border-radius:8px;font-size:.8rem;font-weight:700;display:inline-block}
.rs-ok{background:#dcfce7;color:#15803d}
.rs-low{background:#fef9c3;color:#92400e}
.rs-out{background:#fee2e2;color:#b91c1c}

/* Cross-store checker */
.cs-search-wrap{position:relative;margin-bottom:12px}
.cs-search{width:100%;padding:10px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:.95rem;font-family:inherit}
.cs-search:focus{outline:none;border-color:#4f46e5}
.cs-suggest{display:none;position:absolute;left:0;right:0;top:100%;background:#fff;border:2px solid #4f46e5;border-top:none;border-radius:0 0 10px 10px;max-height:200px;overflow-y:auto;z-index:99;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.cs-result{margin-top:4px}
.cs-color-block{margin-bottom:12px;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
.cs-color-hd{padding:8px 12px;background:#f8fafc;font-weight:700;font-size:.85rem;color:#1a1a2e;border-bottom:1px solid #e2e8f0}
.cs-store-row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid #f0f2f5;font-size:.83rem}
.cs-store-row:last-child{border-bottom:none}
.cs-store-name{min-width:90px;font-weight:600;color:#555}
.cs-sizes{display:flex;flex-wrap:wrap;gap:4px}
.cs-pill{padding:2px 6px;border-radius:8px;font-size:.73rem;font-weight:600}
.cs-pill-in{background:#dcfce7;color:#15803d}
.cs-pill-out{background:#f0f2f5;color:#bbb}
.sp-empty{text-align:center;color:#bbb;padding:28px 0;font-size:.88rem}

/* PDF overlay */
.btn-pdf{background:#16a34a;border:none;color:#fff;padding:12px 22px;border-radius:10px;font-size:.97rem;font-weight:700;cursor:pointer;margin-top:12px;transition:.2s;display:block;width:100%}
.btn-pdf:hover{background:#15803d}
#pdf-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:9999;overflow-y:auto;color-scheme:light}
#pdf-overlay-inner{max-width:600px;margin:0 auto;padding:20px;color:#000;background:#fff}
.pdf-toolbar{position:sticky;top:0;background:#1a1a2e;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.pdf-close{background:none;border:1px solid rgba(255,255,255,.4);color:#fff!important;padding:6px 14px;border-radius:6px;font-size:.83rem;cursor:pointer}
@media print{
  body>*:not(#pdf-overlay){display:none!important}
  #pdf-overlay{display:block!important;position:static!important;height:auto!important;overflow:visible!important}
  #pdf-overlay-inner{padding:0!important}
  .pdf-toolbar{display:none!important}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
@media(max-width:480px){
  .row2{grid-template-columns:1fr}
  .cs-store-row{flex-direction:column;align-items:flex-start;gap:4px}
  .cs-store-name{min-width:unset;font-size:.88rem}
}
</style>
</head>
<body>

<!-- ── LOGIN SCREEN ── -->
<div id="screen-login">
  <div class="login-brand">
    <div class="login-logo">B</div>
    <h1>Bicasso</h1>
    <p>Store Staff Portal</p>
  </div>
  <div class="login-card">
    <label class="login-label">Your Store</label>
    <select id="sli-store" class="login-select">
      <option value="">— Choose your store —</option>
      <option value="Bicasso 1">Bicasso 1</option>
      <option value="Bicasso 2">Bicasso 2</option>
      <option value="Bicasso Nana">Bicasso Nana</option>
    </select>
    <label class="login-label">Passcode</label>
    <input id="sli-pass" type="password" class="login-input" placeholder="Store passcode" onkeydown="if(event.key==='Enter')doStoreLogin()">
    <button id="btn-sli" class="login-btn" onclick="doStoreLogin()">Enter Store</button>
    <div id="sli-err" class="login-err"></div>
  </div>
</div>

<!-- ── MAIN APP ── -->
<div id="screen-app">
  <div id="app-topbar">
    <div style="display:flex;align-items:center;gap:2px">
      <button class="btn-back" id="btn-back" onclick="goBack()" style="display:none">&#8592;</button>
      <div>
        <span class="app-store-label" id="app-store-label">Store</span>
        <span class="app-store-tag">Staff</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn-refresh" id="btn-refresh" onclick="refreshCurrent()" title="Refresh">&#8635;</button>
      <button class="btn-logout" onclick="appLogout()">Logout</button>
    </div>
  </div>

  <div id="app-body">

    <!-- Panel 1: My Store -->
    <div id="panel-mystore" class="panel active">
      <div class="panel-inner">
        <div class="ms-tabs">
          <button class="mstab active" id="sp-tab-mystock" onclick="switchStoreTab('mystock')">📦 Stock</button>
          <button class="mstab" id="sp-tab-sell" onclick="switchStoreTab('sell')">💸 Sell</button>
          <button class="mstab" id="sp-tab-transfer" onclick="switchStoreTab('transfer')">↔ Transfer</button>
          <button class="mstab" id="sp-tab-addstock" onclick="switchStoreTab('addstock')">＋ Add</button>
        </div>
        <div id="sp-body"></div>
      </div>
    </div>

    <!-- Panel 2: Other Stores -->
    <div id="panel-stores" class="panel">
      <div class="panel-inner">
        <div id="stores-content"></div>
      </div>
    </div>

    <!-- Panel 3: Order from Palladium -->
    <div id="panel-order" class="panel">
      <div class="order-banner">📋 Ordering from Palladium for <strong id="order-store-name"></strong></div>

      <!-- Success screen (inside order panel) -->
      <div id="order-success">
        <div class="success-icon">🎉</div>
        <h2>Order Received!</h2>
        <div class="order-id-badge" id="order-id-display"></div>
        <p>Thank you! Your order has been placed.</p>
        <button class="btn-pdf" onclick="saveOrderPdf()">📄 Save Order as PDF</button>
        <button class="btn-new" onclick="resetOrderForm()">Place Another Order</button>
      </div>

      <div class="order-panel-inner" id="order-form-wrap">
        <!-- Hidden shop select (value set to logged-in store) -->
        <select id="cust-shop" style="display:none"></select>

        <!-- Add Items card -->
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid #f0f2f5">
            <h2 style="margin:0;border:none;padding:0">Add Items</h2>
            <div class="mode-toggle">
              <button class="mode-btn active" id="btn-mode-simple" onclick="switchMode('simple')">Simple</button>
              <button class="mode-btn" id="btn-mode-grid" onclick="switchMode('grid')">Grid</button>
            </div>
          </div>

          <!-- Simple mode -->
          <div id="simple-mode">
            <div class="form-group" style="position:relative">
              <label for="prod-search">Search Product ID</label>
              <input type="text" id="prod-search" placeholder="Type product ID e.g. B01, F1165…" autocomplete="off" style="border-radius:8px">
              <div id="prod-suggestions" style="display:none;position:absolute;left:0;right:0;top:100%;background:#fff;border:2px solid #4f46e5;border-top:none;border-radius:0 0 10px 10px;max-height:200px;overflow-y:auto;z-index:99;box-shadow:0 6px 16px rgba(0,0,0,.12)"></div>
            </div>
            <div class="form-group">
              <label for="sel-product">Or browse by category</label>
              <select id="sel-product"><option value="">— Choose a product —</option></select>
            </div>
            <div class="row2">
              <div class="form-group">
                <label for="sel-color">Color</label>
                <select id="sel-color" disabled><option value="">— Choose color —</option></select>
              </div>
              <div class="form-group">
                <label for="sel-size">Size</label>
                <select id="sel-size" disabled><option value="">— Choose size —</option></select>
              </div>
            </div>
            <div class="form-group">
              <label for="inp-qty">Quantity</label>
              <input type="number" id="inp-qty" value="1" min="1" max="999" style="max-width:110px">
            </div>
            <div class="avail-box idle" id="avail-box">
              <span class="avail-icon">ℹ️</span>
              <span id="avail-text">Select product, color and size to check availability.</span>
            </div>
            <button class="btn-add" id="btn-add" style="display:none">＋ Add to Order</button>
          </div>

          <!-- Grid mode -->
          <div id="grid-mode" style="display:none">
            <div class="form-group" style="position:relative">
              <label for="grid-search">Product ID</label>
              <input type="text" id="grid-search" placeholder="Type product ID e.g. F1156, B01…" autocomplete="off">
              <div id="grid-suggestions" style="display:none;position:absolute;left:0;right:0;top:100%;background:#fff;border:2px solid #4f46e5;border-top:none;border-radius:0 0 10px 10px;max-height:200px;overflow-y:auto;z-index:99;box-shadow:0 6px 16px rgba(0,0,0,.12)"></div>
            </div>
            <div id="grid-product-view" style="display:none">
              <div class="grid-product-bar">
                <span class="grid-product-name" id="grid-product-name"></span>
                <button class="btn-change-prod" onclick="clearGrid()">✕ Change Product</button>
              </div>
              <div class="grid-wrap" id="grid-wrap"></div>
              <button class="btn-add-grid" id="btn-add-grid" onclick="addGridToCart()">＋ Add to Order</button>
            </div>
          </div>
        </div>

        <!-- Cart card -->
        <div class="card">
          <h2>Order Summary <span id="cart-count" style="font-size:.78rem;background:#4f46e5;color:#fff;border-radius:20px;padding:2px 8px;margin-left:5px;display:none">0</span></h2>
          <div id="cart-wrap"><p class="empty-msg">No items added yet.</p></div>
        </div>

        <!-- Submit card -->
        <div class="card">

// ── API SHIM ─────────────────────────────────────────────────────
var API_URL = 'https://script.google.com/macros/s/AKfycby-5YfvPpePbg1ni36sL5AI-DelH_I5qHgm1mkmAKqBSsopJPn-YWi24kXDMPMFkD-v/exec';
(function(){
  if (typeof google !== 'undefined' && google.script && google.script.run) return;
  var GET_ACTIONS = { getBusinessName:1, getInventory:1, getAllRetailStock:1 };
  var POST_ARGS = { getOrders:['password'], submitOrder:['order'], sendInvoice:['orderId','password'], deleteOrder:['orderId','password'], editOrderItems:['orderId','newItems','password'], markDone:['orderId','password'], verifyRetailStore:['storeName','password'], getStoreStock:['storeName'], sellRetailStock:['storeName','password','rowId','qty'], transferStock:['fromStore','toStore','password','rowId','qty'], updateRetailStockQty:['storeName','password','productId','colorNum','size','newQty'] };
  function makeRunner(){ var onOk=null,onErr=null; var runner={ withSuccessHandler:function(cb){onOk=cb;return runner;}, withFailureHandler:function(cb){onErr=cb;return runner;} }; function attach(name){ runner[name]=function(){ var args=arguments,req; if(GET_ACTIONS[name]){ req=fetch(API_URL+'?action='+encodeURIComponent(name)); }else{ var payload={action:name}; (POST_ARGS[name]||[]).forEach(function(k,i){payload[k]=args[i];}); req=fetch(API_URL,{method:'POST',body:JSON.stringify(payload)}); } req.then(function(r){return r.json();}).then(function(res){if(onOk)onOk(res);}).catch(function(err){if(onErr)onErr(err);}); }; } Object.keys(GET_ACTIONS).forEach(attach); Object.keys(POST_ARGS).forEach(attach); return runner; }
  window.google=window.google||{}; window.google.script=window.google.script||{}; Object.defineProperty(window.google.script,'run',{get:makeRunner});
})();

// ── STATE ─────────────────────────────────────────────────────────
var INVENTORY       = {};
var GROUPS          = [];
var cart            = [];
var nextId          = 1;
var lastOrder       = null;
var SESSION_STORE   = null;
var ALL_RETAIL_STOCK = null;
var ALL_STORES      = ['Bicasso 1','Bicasso 2','Bicasso Nana','Palladium'];

// ── DOM REFS ──────────────────────────────────────────────────────
var selProd  = document.getElementById('sel-product');

// ── LOGIN ─────────────────────────────────────────────────────────
function doStoreLogin() {
  var storeName = document.getElementById('sli-store').value;

  var errEl     = document.getElementById('sli-err');
  errEl.textContent = '';
  if (!storeName) { errEl.textContent = '⚠ Please select your store.'; return; }
  if (!pass)      { errEl.textContent = '⚠ Please enter your passcode.'; return; }
  var btn = document.getElementById('btn-sli');
  btn.textContent = 'Verifying…'; btn.disabled = true;
  google.script.run
    .withSuccessHandler(function(result) {
      btn.textContent = 'Enter Store'; btn.disabled = false;
      if (result.success) {
        SESSION_STORE = { name: storeName, pass: pass };
        showApp();
      } else {
        errEl.textContent = '❌ Wrong passcode. Please try again.';
      }
    })
    .withFailureHandler(function() {
      btn.textContent = 'Enter Store'; btn.disabled = false;
      errEl.textContent = '❌ Connection error. Please try again.';

}

function appLogout() {

// ── NAVIGATION STATE ──────────────────────────────────────────────

// ── STOCK LOADING ─────────────────────────────────────────────────
function loadStoreStock() {
  if (!SESSION_STORE) return;
  var myStore = SESSION_STORE.name;
  if (ALL_RETAIL_STOCK && ALL_RETAIL_STOCK[myStore]) { switchStoreTab('mystock'); return; }
  document.getElementById('sp-body').innerHTML = '<div style="text-align:center;padding:40px;color:#888"><div class="spinner"></div><br><br>Loading stock…</div>';
  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        ALL_RETAIL_STOCK = ALL_RETAIL_STOCK || {};
        Object.keys(result.stores || {}).forEach(function(k){ ALL_RETAIL_STOCK[k] = result.stores[k]; });

// ── STORE TABS ────────────────────────────────────────────────────
function switchStoreTab(tab) {
  CURRENT_TAB = tab;
  ['mystock','sell','transfer','addstock'].forEach(function(t) {
    var el = document.getElementById('sp-tab-' + t);
    if (el) el.classList.toggle('active', t === tab);
  });
  if (tab === 'mystock') renderMyStock();
  else if (tab === 'sell') renderSellTab();
  else if (tab === 'transfer') renderTransferTab();
  else if (tab === 'addstock') renderAddStockTab();
  updateBackBtn();
}

// ── MY STOCK ──────────────────────────────────────────────────────
function myStockBadge(qty) {
  return qty === 0 ? 'rs-out' : qty <= 3 ? 'rs-low' : 'rs-ok';
}

function flatRows(inv) {
  var rows = [];
  if (!inv) return rows;
  Object.keys(inv).forEach(function(pid) {
    Object.keys(inv[pid]).forEach(function(colorKey) {
      var cn = colorKey.replace(/^Color\s*/i, '');
      Object.keys(inv[pid][colorKey]).forEach(function(size) {
        rows.push({ pid: pid, cn: cn, size: size, qty: parseInt(inv[pid][colorKey][size]) || 0 });
      });
    });
  });
  return rows;
}

function renderMyStock() {
  if (!SESSION_STORE) return;
  var inv  = ALL_RETAIL_STOCK && ALL_RETAIL_STOCK[SESSION_STORE.name];
  var html = '<input type="text" class="rs-search" id="ms-search" placeholder="🔍 Search by ID, color or size…" oninput="filterMyStock(this.value)">';
  html += '<div id="ms-list" style="border:1px solid #e2e8f0;border-radius:10px;overflow:hidden">' + buildMyStockList(flatRows(inv), '') + '</div>';
  document.getElementById('sp-body').innerHTML = html;
}

function buildMyStockList(rows, q) {
  if (!rows || !rows.length) return '<div class="sp-empty">No stock data found.</div>';
  var filtered = q ? rows.filter(function(r){
    var combined = (r.pid + r.cn + r.size).toLowerCase();
    return combined.indexOf(q.toLowerCase()) !== -1;
  }) : rows;
  if (!filtered.length) return '<div class="sp-empty">No results for "' + q + '"</div>';
  var header = '<thead><tr style="background:#1a1a2e">'
    + '<th style="padding:9px 12px;text-align:left;font-size:.72rem;text-transform:uppercase;color:#9ca3af;font-weight:700;letter-spacing:.05em">ID</th>'
    + '<th style="padding:9px 10px;text-align:center;font-size:.72rem;text-transform:uppercase;color:#9ca3af;font-weight:700;letter-spacing:.05em">Color</th>'
    + '<th style="padding:9px 10px;text-align:center;font-size:.72rem;text-transform:uppercase;color:#9ca3af;font-weight:700;letter-spacing:.05em">Size</th>'
    + '<th style="padding:9px 12px;text-align:center;font-size:.72rem;text-transform:uppercase;color:#9ca3af;font-weight:700;letter-spacing:.05em">Qty</th>'
    + '</tr></thead>';
  var body = '<tbody>' + filtered.map(function(r) {
    var cls = myStockBadge(r.qty);
    return '<tr style="border-bottom:1px solid #f0f2f5">'
      + '<td style="padding:9px 12px;font-size:.88rem;font-weight:700;color:#1a1a2e;font-family:monospace">' + r.pid + '</td>'
      + '<td style="padding:9px 10px;text-align:center;font-size:.88rem;color:#555">' + r.cn + '</td>'
      + '<td style="padding:9px 10px;text-align:center;font-size:.88rem;color:#555">' + r.size + '</td>'
      + '<td style="padding:9px 12px;text-align:center"><span class="rs-badge ' + cls + '">' + r.qty + '</span></td>'
      + '</tr>';
  }).join('') + '</tbody>';
  return '<table style="width:100%;border-collapse:collapse">' + header + body + '</table>';
}

function filterMyStock(q) {
  var inv = ALL_RETAIL_STOCK && SESSION_STORE && ALL_RETAIL_STOCK[SESSION_STORE.name];
  document.getElementById('ms-list').innerHTML = buildMyStockList(flatRows(inv), q);
}

function renderSellTab() {

    '<label style="display:block;font-size:.85rem;font-weight:600;color:#555;margin-bottom:6px">Product ID (from label)</label>'

    + ' style="width:100%;padding:13px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:1.05rem;font-family:inherit;margin-bottom:16px"'

function doSell() {
  var rowId = (document.getElementById('sell-id').value || '').trim().toUpperCase();
  var qty   = parseInt(document.getElementById('sell-qty').value) || 0;
  var resEl = document.getElementById('sell-result');
  if (!rowId) { resEl.innerHTML = '<span style="color:#b91c1c">⚠ Enter a product ID.</span>'; return; }
  if (qty <= 0) { resEl.innerHTML = '<span style="color:#b91c1c">⚠ Quantity must be at least 1.</span>'; return; }
  resEl.innerHTML = '<span style="color:#888">Processing…</span>';
  google.script.run
    .withSuccessHandler(function(r) {
      if (r.success) {
        var inv = ALL_RETAIL_STOCK && ALL_RETAIL_STOCK[SESSION_STORE.name];
        if (inv) {
          Object.keys(inv).forEach(function(pid) {
            Object.keys(inv[pid]).forEach(function(colorKey) {
              var cn = colorKey.replace(/^Color\s*/i, '');
              Object.keys(inv[pid][colorKey]).forEach(function(size) {
                if ((pid + cn + size).toUpperCase() === rowId) inv[pid][colorKey][size] = r.newQty;
              });
            });
          });
        }
        resEl.innerHTML = '<span style="color:#16a34a;font-weight:700">✓ Sold ' + qty + ' — New stock: ' + r.newQty + '</span>';
        document.getElementById('sell-id').value = '';
        document.getElementById('sell-qty').value = '1';

        resEl.innerHTML = '<span style="color:#b91c1c">❌ ' + (r.error || 'Error') + '</span>';
      }
    })
    .withFailureHandler(function() {
      resEl.innerHTML = '<span style="color:#b91c1c">❌ Connection error. Try again.</span>';
    })

// ── TRANSFER TAB ──────────────────────────────────────────────────
function renderTransferTab() {
  var myStore = SESSION_STORE ? SESSION_STORE.name : '';
  var RETAIL_STORES = ['Bicasso 1','Bicasso 2','Bicasso Nana'];
  var toOpts = RETAIL_STORES.filter(function(s){ return s !== myStore; })

    + '<label style="display:block;font-size:.85rem;font-weight:600;color:#555;margin-bottom:5px">To store</label>'
    + '<select id="tr-to" style="width:100%;padding:11px 12px;border:2px solid #e2e8f0;border-radius:9px;font-size:.95rem;margin-bottom:12px">' + toOpts + '</select>'
    + '<label style="display:block;font-size:.85rem;font-weight:600;color:#555;margin-bottom:5px">Product ID</label>'
    + '<input id="tr-id" type="text" placeholder="e.g. T90274352" autocapitalize="characters" oninput="this.value=this.value.toUpperCase()"'
    + ' style="width:100%;padding:12px 14px;border:2px solid #e2e8f0;border-radius:9px;font-size:1rem;font-family:monospace;margin-bottom:12px;text-transform:uppercase">'
    + '<label style="display:block;font-size:.85rem;font-weight:600;color:#555;margin-bottom:5px">Quantity</label>'
    + '<input id="tr-qty" type="number" min="1" value="1" style="width:100%;padding:12px 14px;border:2px solid #e2e8f0;border-radius:9px;font-size:1rem;margin-bottom:16px">'
    + '<button onclick="doTransfer()" style="width:100%;padding:14px;background:#7c3aed;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer">↔ Transfer Stock</button>'
    + '<div id="tr-result" style="margin-top:14px;text-align:center;font-size:.92rem;min-height:24px"></div>';
}

function doTransfer() {
  var fromStore = SESSION_STORE ? SESSION_STORE.name : '';
  var toStore   = document.getElementById('tr-to').value;
  var rowId     = (document.getElementById('tr-id').value || '').trim().toUpperCase();
  var qty       = parseInt(document.getElementById('tr-qty').value) || 0;
  var resEl     = document.getElementById('tr-result');
  if (fromStore === toStore) { resEl.innerHTML = '<span style="color:#b91c1c">⚠ Source and destination must differ.</span>'; return; }
  if (!rowId) { resEl.innerHTML = '<span style="color:#b91c1c">⚠ Enter a product ID.</span>'; return; }
  if (qty <= 0) { resEl.innerHTML = '<span style="color:#b91c1c">⚠ Quantity must be at least 1.</span>'; return; }
  resEl.innerHTML = '<span style="color:#888">Transferring…</span>';
  google.script.run
    .withSuccessHandler(function(r) {
      if (r.success) {
        if (ALL_RETAIL_STOCK) {
          [fromStore, toStore].forEach(function(st) {
            if (!ALL_RETAIL_STOCK[st]) return;
            Object.keys(ALL_RETAIL_STOCK[st]).forEach(function(pid) {
              Object.keys(ALL_RETAIL_STOCK[st][pid]).forEach(function(colorKey) {
                var cn = colorKey.replace(/^Color\s*/i,'');
                Object.keys(ALL_RETAIL_STOCK[st][pid][colorKey]).forEach(function(size) {
                  if ((pid+cn+size).toUpperCase() === rowId) {
                    ALL_RETAIL_STOCK[st][pid][colorKey][size] = st === fromStore ? r.fromNewQty : r.toNewQty;
                  }
                });
              });
            });
          });
        }
        resEl.innerHTML = '<span style="color:#16a34a;font-weight:700">✓ Transferred ' + qty + ' from ' + fromStore + ' to ' + toStore + '</span>'
          + '<br><span style="color:#555;font-size:.85rem">' + fromStore + ': ' + r.fromNewQty + ' left &nbsp;|&nbsp; ' + toStore + ': ' + r.toNewQty + ' now</span>';
        document.getElementById('tr-id').value = '';
        document.getElementById('tr-qty').value = '1';
      } else {
        resEl.innerHTML = '<span style="color:#b91c1c">❌ ' + (r.error || 'Error') + '</span>';
      }
    })
    .withFailureHandler(function() { resEl.innerHTML = '<span style="color:#b91c1c">❌ Connection error.</span>'; })
    .transferStock(fromStore, toStore, '', rowId, qty);
}

    + '<div id="as-result" style="margin-top:14px;text-align:center;font-size:.92rem;min-height:24px"></div>';

function doAddStock() {
  var pid   = (document.getElementById('as-pid').value || '').trim().toUpperCase();
  var color = (document.getElementById('as-color').value || '').trim();
  var size  = (document.getElementById('as-size').value || '').trim();
  var qty   = parseInt(document.getElementById('as-qty').value);
  var resEl = document.getElementById('as-result');
  if (!pid)          { resEl.innerHTML = '<span style="color:#b91c1c">⚠ Enter a product ID.</span>'; return; }
  if (!color)        { resEl.innerHTML = '<span style="color:#b91c1c">⚠ Enter a color number.</span>'; return; }
  if (!size)         { resEl.innerHTML = '<span style="color:#b91c1c">⚠ Enter a size.</span>'; return; }
  if (isNaN(qty) || qty < 0) { resEl.innerHTML = '<span style="color:#b91c1c">⚠ Enter a valid quantity.</span>'; return; }
  resEl.innerHTML = '<span style="color:#888">Saving…</span>';
  google.script.run
    .withSuccessHandler(function(r) {
      if (r.success) {
        var colorKey = 'Color ' + color;
        if (ALL_RETAIL_STOCK && ALL_RETAIL_STOCK[SESSION_STORE.name]) {
          var inv = ALL_RETAIL_STOCK[SESSION_STORE.name];
          if (!inv[pid]) inv[pid] = {};
          if (!inv[pid][colorKey]) inv[pid][colorKey] = {};
          inv[pid][colorKey][size] = qty;
        }
        resEl.innerHTML = '<span style="color:#16a34a;font-weight:700">✓ ' + pid + ' / ' + color + ' / ' + size + ' → ' + qty + ' units saved</span>';
        document.getElementById('as-pid').value = '';
        document.getElementById('as-color').value = '';
        document.getElementById('as-size').value = '';
        document.getElementById('as-qty').value = '1';
        document.getElementById('as-pid').focus();
      } else {
        resEl.innerHTML = '<span style="color:#b91c1c">❌ ' + (r.error || 'Error') + '</span>';
      }
    })
    .withFailureHandler(function() {
      resEl.innerHTML = '<span style="color:#b91c1c">❌ Connection error. Try again.</span>';
    })
    .updateRetailStockQty(SESSION_STORE.name, SESSION_STORE.pass, pid, color, size, qty);
}

// ── OTHER STORES ──────────────────────────────────────────────────
// Build a flat index of all rows across all stores for fast searching
var CS_ROWS = null; // [{ pid, cn, size, stores:{storeName:qty} }]

function buildCsRows() {
  CS_ROWS = [];
  var index = {}; // key = pid+'|'+cn+'|'+size
  ALL_STORES.forEach(function(s) {
    var inv = ALL_RETAIL_STOCK && ALL_RETAIL_STOCK[s];
    if (!inv) return;
    Object.keys(inv).forEach(function(pid) {
      Object.keys(inv[pid]).forEach(function(colorKey) {
        var cn = colorKey.replace(/^Color\s*/i, '');
        Object.keys(inv[pid][colorKey]).forEach(function(size) {
          var key = pid + '|' + cn + '|' + size;
          if (!index[key]) { index[key] = { pid:pid, cn:cn, size:size, stores:{} }; CS_ROWS.push(index[key]); }
          index[key].stores[s] = parseInt(inv[pid][colorKey][size]) || 0;
        });
      });
    });
  });
}

function renderOtherStores() {
  var el = document.getElementById('stores-content');
  if (!el) return;
  var allLoaded = ALL_STORES.every(function(s){ return ALL_RETAIL_STOCK && ALL_RETAIL_STOCK[s]; });
  if (!allLoaded) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:#888"><div class="spinner"></div><br><br>Loading stores…</div>';
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          ALL_RETAIL_STOCK = ALL_RETAIL_STOCK || {};
          Object.keys(result.stores || {}).forEach(function(k){ ALL_RETAIL_STOCK[k] = result.stores[k]; });
          CS_ROWS = null;
          renderOtherStores();
        } else {
          el.innerHTML = '<div class="sp-empty">⚠ Could not load store data.</div>';
        }
      })
      .withFailureHandler(function(){ el.innerHTML = '<div class="sp-empty">⚠ Connection error.</div>'; })
      .getAllRetailStock();
    return;
  }
  if (!CS_ROWS) buildCsRows();
  var STORE_LABELS = ['B1','B2','BN','Pal'];
  el.innerHTML =
    '<div style="background:#1a1a2e;border-radius:12px;padding:14px 14px 10px;margin-bottom:12px">'
    + '<div style="color:#fff;font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;opacity:.7">Search stock across all stores</div>'
    + '<input type="text" id="cs-inp" placeholder="ID, color, size or full code…" autocomplete="off" autocapitalize="characters"'
    + ' oninput="csSearchFlat(this.value)"'
    + ' style="width:100%;padding:11px 14px;border:none;border-radius:9px;font-size:.97rem;font-family:monospace;background:rgba(255,255,255,.1);color:#fff;outline:none">'
    + '<div style="display:flex;gap:8px;margin-top:8px">'
    + STORE_LABELS.map(function(l,i){ return '<div style="flex:1;text-align:center;background:rgba(255,255,255,.08);border-radius:6px;padding:5px 2px;font-size:.72rem;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase">' + l + '</div>'; }).join('')
    + '</div>'
    + '</div>'
    + '<div id="cs-result"></div>';
  csSearchFlat('');
}

function csSearchFlat(q) {
  q = (q || '').trim().toUpperCase();
  var resEl = document.getElementById('cs-result');
  if (!resEl || !CS_ROWS) return;

  var filtered = q ? CS_ROWS.filter(function(r) {
    var compact = r.pid + r.cn + r.size;
    return compact.indexOf(q) !== -1
      || r.pid.indexOf(q) !== -1
      || r.cn.indexOf(q) !== -1
      || r.size.indexOf(q) !== -1;
  }) : [];

  if (!q) {
    resEl.innerHTML = '<div class="sp-empty" style="padding:32px 0">Type a product ID, color, size, or full code above to search.</div>';
    return;
  }
  if (!filtered.length) {
    resEl.innerHTML = '<div class="sp-empty" style="padding:32px 0">No results for <strong>' + q + '</strong></div>';
    return;
  }

  // Group by product ID for visual grouping
  var byPid = {}, pidOrder = [];
  filtered.forEach(function(r) {
    if (!byPid[r.pid]) { byPid[r.pid] = []; pidOrder.push(r.pid); }
    byPid[r.pid].push(r);
  });

  var STORE_KEYS = ALL_STORES; // ['Bicasso 1','Bicasso 2','Bicasso Nana','Palladium']
  var STORE_SHORT = ['B1','B2','BN','Pal'];

  var html = '';
  pidOrder.forEach(function(pid) {
    var rows = byPid[pid];
    html += '<div style="background:#fff;border-radius:12px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.07)">';
    html += '<div style="background:#1a1a2e;padding:9px 14px;display:flex;align-items:center;justify-content:space-between">'
      + '<span style="color:#fff;font-size:.92rem;font-weight:700;font-family:monospace">' + pid + '</span>'
      + '<span style="color:rgba(255,255,255,.5);font-size:.72rem">' + rows.length + ' variant' + (rows.length>1?'s':'') + '</span>'
      + '</div>';
    html += '<table style="width:100%;border-collapse:collapse;font-size:.83rem">';
    html += '<thead><tr style="background:#f8fafc">'
      + '<th style="padding:7px 10px;text-align:left;font-size:.7rem;text-transform:uppercase;color:#888;font-weight:700">Color</th>'
      + '<th style="padding:7px 8px;text-align:center;font-size:.7rem;text-transform:uppercase;color:#888;font-weight:700">Size</th>'
      + STORE_SHORT.map(function(s){ return '<th style="padding:7px 6px;text-align:center;font-size:.7rem;text-transform:uppercase;color:#888;font-weight:700">'+s+'</th>'; }).join('')
      + '</tr></thead><tbody>';
    rows.forEach(function(r, i) {
      var border = i < rows.length-1 ? 'border-bottom:1px solid #f0f2f5' : '';
      html += '<tr style="' + border + '">'
        + '<td style="padding:8px 10px;font-weight:600;color:#374151;font-family:monospace">' + r.cn + '</td>'
        + '<td style="padding:8px 8px;text-align:center;color:#374151;font-family:monospace">' + r.size + '</td>'
        + STORE_KEYS.map(function(s) {
            var qty = (r.stores[s] !== undefined) ? r.stores[s] : '–';
            var isSelf = SESSION_STORE && SESSION_STORE.name === s;
            var bg = '', color = '#9ca3af';
            if (typeof qty === 'number') {
              if (qty === 0) { bg=''; color='#d1d5db'; }
              else if (qty <= 3) { bg='background:#fffbeb'; color='#92400e'; }
              else { bg='background:#f0fdf4'; color='#15803d'; }
            }
            var bold = isSelf ? 'font-weight:700;' : '';
            var selfMark = isSelf ? '★' : '';
            return '<td style="padding:8px 6px;text-align:center;' + bg + bold + '">'
              + (typeof qty==='number' ? '<span style="color:' + color + ';font-weight:700">' + selfMark + qty + '</span>' : '<span style="color:#d1d5db">–</span>')
              + '</td>';
          }).join('')
        + '</tr>';
    });
    html += '</tbody></table></div>';
  });

  resEl.innerHTML = '<div style="font-size:.78rem;color:#888;margin-bottom:8px">' + filtered.length + ' result' + (filtered.length>1?'s':'') + ' for <strong style="color:#1a1a2e">' + q + '</strong></div>' + html;
}

function showCsResult(pid) {
  document.getElementById('cs-inp').value = pid;
  csSearchFlat(pid);
}


// ── ORDER FORM (Inventory load — deferred until Order panel opens) ─
var INVENTORY_LOADED = false;

function loadInventory() {
  if (INVENTORY_LOADED) return;
  selProd.innerHTML = '<option value="">⏳ Loading products…</option>';
  selProd.disabled = true;
  try {
    google.script.run
      .withSuccessHandler(function(result) {
        INVENTORY_LOADED = true;
        if (result && result.success) {
          INVENTORY = result.inventory;
          GROUPS    = result.groups;
          buildProductDropdown();
        } else {
          selProd.innerHTML = '<option value="">⚠ Could not load products</option>';
        }
      })
      .withFailureHandler(function() {
        selProd.innerHTML = '<option value="">⚠ Could not load products</option>';
      })
      .getInventory();
  } catch(e) {
    selProd.innerHTML = '<option value="">— Choose a product —</option>';
    selProd.disabled = false;
  }
}

// ── MODE TOGGLE ───────────────────────────────────────────────────
function switchMode(mode) {
  var isGrid = mode === 'grid';
  document.getElementById('simple-mode').style.display = isGrid ? 'none' : 'block';
  document.getElementById('grid-mode').style.display   = isGrid ? 'block' : 'none';
  document.getElementById('btn-mode-simple').classList.toggle('active', !isGrid);
  document.getElementById('btn-mode-grid').classList.toggle('active',  isGrid);
  if (isGrid) setTimeout(function(){ document.getElementById('grid-search').focus(); }, 50);
}

// ── GRID MODE ─────────────────────────────────────────────────────
var GRID_PROD = null;

(function(){
  var gridInput   = document.getElementById('grid-search');
  var gridSuggest = document.getElementById('grid-suggestions');
  gridInput.addEventListener('input', function() {
    var q = this.value.trim().toLowerCase();
    gridSuggest.innerHTML = '';
    if (!q) { gridSuggest.style.display='none'; return; }
    var matches = Object.keys(INVENTORY).filter(function(p){ return p.toLowerCase().indexOf(q) !== -1; });
    if (!matches.length) { gridSuggest.style.display='none'; return; }
    matches.forEach(function(p) {
      var d = document.createElement('div');
      d.textContent = p;
      d.style.cssText = 'padding:10px 14px;cursor:pointer;font-size:.95rem;border-bottom:1px solid #f0f2f5;color:#1a1a2e';
      d.addEventListener('mousedown', function(e){ e.preventDefault(); buildProductGrid(p); gridInput.value=p; gridSuggest.style.display='none'; });
      d.addEventListener('mouseover',  function(){ this.style.background='#f0f2f5'; });
      d.addEventListener('mouseout',   function(){ this.style.background='#fff'; });
      gridSuggest.appendChild(d);
    });
    gridSuggest.style.display = 'block';
  });
  gridInput.addEventListener('blur', function(){ setTimeout(function(){ gridSuggest.style.display='none'; }, 150); });
  gridInput.addEventListener('keydown', function(e){
    if (e.key==='Enter') { var q=gridInput.value.trim(); if(INVENTORY[q]){ buildProductGrid(q); gridSuggest.style.display='none'; } }
  });
})();

function buildProductGrid(prod) {
  if (!INVENTORY[prod]) return;
  GRID_PROD = prod;
  var inv = INVENTORY[prod];
  var sizeSet = {};
  Object.keys(inv).forEach(function(c){ Object.keys(inv[c]).forEach(function(s){ if((inv[c][s]||0)>0) sizeSet[s]=1; }); });
  var sizes = Object.keys(sizeSet).sort(function(a,b){ var na=parseFloat(a),nb=parseFloat(b); return (!isNaN(na)&&!isNaN(nb))?na-nb:(a<b?-1:1); });
  var colors = Object.keys(inv).filter(function(c){ return Object.keys(inv[c]).some(function(s){ return (inv[c][s]||0)>0; }); });
  var thead = '<tr><th class="grid-th-color"></th>' + sizes.map(function(s){ return '<th class="grid-th-size">'+s+'</th>'; }).join('') + '</tr>';
  var tbody = colors.map(function(color) {
    var cells = sizes.map(function(size) {
      var stock = (inv[color]&&inv[color][size]!==undefined)?inv[color][size]:0;
      var inCart = qtyInCart(prod,color,size);
      var avail  = Math.max(0,stock-inCart);
      if (stock<=0) return '<td class="grid-td-cell"><input class="grid-cell-out" type="text" disabled value="—" tabindex="-1"></td>';
      var id = 'gc-'+prod.replace(/[^a-z0-9]/gi,'_')+'-'+color.replace(/\s/g,'_')+'-'+size;
      return '<td class="grid-td-cell"><input class="grid-cell" id="'+id+'" type="number" inputmode="numeric" min="0" max="'+avail+'" placeholder="" data-prod="'+prod+'" data-color="'+color+'" data-size="'+size+'" data-stock="'+stock+'" data-avail="'+avail+'" oninput="onGridCellInput(this)"></td>';
    }).join('');
    return '<tr><td class="grid-td-color">'+color+'</td>'+cells+'</tr>';
  }).join('');
  document.getElementById('grid-wrap').innerHTML = '<table class="grid-table"><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table>';
  document.getElementById('grid-product-name').textContent = prod;
  document.getElementById('btn-add-grid').textContent = '＋ Add '+prod+' to Order';
  document.getElementById('grid-product-view').style.display = 'block';
}

function onGridCellInput(el) {
  var val=parseInt(el.value)||0, avail=parseInt(el.dataset.avail)||0;
  if (val>avail){ el.value=avail; val=avail; }
  if (val<0){ el.value=0; val=0; }
  el.classList.toggle('filled',val>0);
}

function addGridToCart() {
  if (!GRID_PROD) return;
  var cells = document.querySelectorAll('#grid-wrap .grid-cell');
  var added = 0;
  cells.forEach(function(el) {
    var qty=parseInt(el.value)||0;
    if (qty<=0) return;
    var prod=el.dataset.prod, color=el.dataset.color, size=el.dataset.size, stock=parseInt(el.dataset.stock)||0;
    qty = Math.min(qty, stock-qtyInCart(prod,color,size));
    if (qty<=0) return;
    var lc=color.replace('Color ','');
    var existing=cart.find(function(i){ return i.product===prod&&i.color===color&&i.size===size; });
    if (existing) existing.qty+=qty;
    else cart.push({id:nextId++,product:prod,color:color,size:size,qty:qty,lookupType:'main',lp:prod,lc:lc,ls:size});
    added++;
  });
  if (added===0) {
    document.getElementById('btn-add-grid').textContent='⚠ Enter a quantity first';
    setTimeout(function(){ document.getElementById('btn-add-grid').textContent='＋ Add '+GRID_PROD+' to Order'; },1500);
    return;
  }
  renderCart();
  var name=GRID_PROD; clearGrid();
  var btn=document.getElementById('btn-add-grid');
  if (btn){ btn.textContent='✓ '+name+' added!'; btn.style.background='#22c55e'; setTimeout(function(){ if(btn){ btn.textContent='＋ Add to Order'; btn.style.background=''; } },1300); }
}

function clearGrid() {
  GRID_PROD=null;
  document.getElementById('grid-product-view').style.display='none';
  document.getElementById('grid-search').value='';
  document.getElementById('grid-suggestions').style.display='none';
  document.getElementById('grid-search').focus();
}

// ── PRODUCT SEARCH ────────────────────────────────────────────────
var prodSearchEl = document.getElementById('prod-search');
var prodSuggest  = document.getElementById('prod-suggestions');

prodSearchEl.addEventListener('input', function() {
  var q=this.value.trim().toLowerCase();
  prodSuggest.innerHTML='';
  if (!q){ prodSuggest.style.display='none'; return; }
  var matches=Object.keys(INVENTORY).filter(function(p){ return p.toLowerCase().indexOf(q)!==-1; });
  if (!matches.length){ prodSuggest.style.display='none'; return; }
  matches.forEach(function(p) {
    var div=document.createElement('div');
    div.textContent=p;
    div.style.cssText='padding:10px 14px;cursor:pointer;font-size:.95rem;border-bottom:1px solid #f0f2f5;color:#1a1a2e';
    div.addEventListener('mousedown',function(e){ e.preventDefault(); selectProduct(p); prodSearchEl.value=p; prodSuggest.style.display='none'; });
    div.addEventListener('mouseover', function(){ this.style.background='#f0f2f5'; });
    div.addEventListener('mouseout',  function(){ this.style.background='#fff'; });
    prodSuggest.appendChild(div);
  });
  prodSuggest.style.display='block';
});
prodSearchEl.addEventListener('blur', function(){ setTimeout(function(){ prodSuggest.style.display='none'; },150); });

function selectProduct(prod) {
  if (!INVENTORY[prod]) return;
  selProd.value=prod; resetColor(); resetSize(); hideAvail(); btnAdd.style.display='none';
  var colors=Object.keys(INVENTORY[prod]).filter(function(c){ return Object.keys(INVENTORY[prod][c]).some(function(s){ return INVENTORY[prod][c][s]>0; }); });
  selColor.innerHTML='<option value="">— Choose color —</option>';
  colors.forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=c; selColor.appendChild(o); });
  selColor.disabled=false;
  selColor.scrollIntoView({behavior:'smooth',block:'center'});
}

function buildProductDropdown() {
  selProd.innerHTML='<option value="">— Choose a product —</option>';
  GROUPS.forEach(function(g) {
    var og=document.createElement('optgroup'); og.label=g.label;
    g.products.forEach(function(p){ if(!INVENTORY[p]) return; var opt=document.createElement('option'); opt.value=p; opt.textContent=p; og.appendChild(opt); });
    if (og.childElementCount>0) selProd.appendChild(og);
  });
  selProd.disabled=false;
}

selProd.addEventListener('change', function() {
  var prod=selProd.value; resetColor(); resetSize(); hideAvail(); btnAdd.style.display='none';
  if (prodSearchEl) prodSearchEl.value=prod||'';
  if (!prod) return;
  var colors=Object.keys(INVENTORY[prod]).filter(function(c){ return Object.keys(INVENTORY[prod][c]).some(function(s){ return INVENTORY[prod][c][s]>0; }); });
  selColor.innerHTML='<option value="">— Choose color —</option>';
  colors.forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=c; selColor.appendChild(o); });
  selColor.disabled=false;
});

selColor.addEventListener('change', function() {
  var prod=selProd.value, color=selColor.value;
  resetSize(); hideAvail(); btnAdd.style.display='none';
  if (!prod||!color) return;
  var sizes=Object.keys(INVENTORY[prod][color]).filter(function(s){ return INVENTORY[prod][color][s]>0; });
  selSize.innerHTML='<option value="">— Choose size —</option>';
  sizes.forEach(function(s){ var o=document.createElement('option'); o.value=s; o.textContent=s; selSize.appendChild(o); });
  selSize.disabled=false;
});

selSize.addEventListener('change', checkAvail);

function qtyInCart(prod, color, size) {
  var item=cart.find(function(i){ return i.product===prod&&i.color===color&&i.size===size; });
  return item ? item.qty : 0;
}

function checkAvail() {
  var prod=selProd.value, color=selColor.value, size=selSize.value;
  if (!prod||!color||!size){ hideAvail(); btnAdd.style.display='none'; return; }
  var stock=(INVENTORY[prod]&&INVENTORY[prod][color])?INVENTORY[prod][color][size]:undefined;
  availBox.className='avail-box';
  if (stock===undefined){ availBox.classList.add('idle'); availTxt.textContent='This combination is not in inventory.'; btnAdd.style.display='none'; return; }
  if (stock<=0){ availBox.classList.add('no'); availTxt.innerHTML='<strong>❌ Out of Stock</strong>'; btnAdd.style.display='none'; return; }
  var remaining=stock-qtyInCart(prod,color,size);
  if (remaining<=0){ availBox.classList.add('no'); availTxt.innerHTML='<strong>🛒 All '+stock+' already in your order</strong>'; btnAdd.style.display='none'; inpQty.max=stock; return; }
  inpQty.max=remaining;
  if ((parseInt(inpQty.value)||1)>remaining) inpQty.value=remaining;
  availBox.classList.add('ok');
  availTxt.innerHTML=stock>3?'<strong>✅ In Stock</strong>':'<strong>✅ Only '+stock+' left!</strong>';
  btnAdd.style.display='block';
}

btnAdd.addEventListener('click', function() {
  var prod=selProd.value, color=selColor.value, size=selSize.value;
  var qty=Math.max(1,parseInt(inpQty.value)||1);
  var stock=INVENTORY[prod]&&INVENTORY[prod][color]?INVENTORY[prod][color][size]:0;
  if (!prod||!color||!size||stock<=0) return;
  var alreadyIn=qtyInCart(prod,color,size), remaining=stock-alreadyIn;
  if (remaining<=0){ availBox.className='avail-box no'; availTxt.innerHTML='<strong>🛒 All '+stock+' already in your order</strong>'; btnAdd.style.display='none'; return; }
  if (qty>remaining){ qty=remaining; availTxt.innerHTML='<strong>⚠ Only '+stock+' available — added '+remaining+'</strong>'; }
  var lc=color.replace('Color ','');
  var existing=cart.find(function(i){ return i.product===prod&&i.color===color&&i.size===size; });
  if (existing) existing.qty+=qty;
  else cart.push({id:nextId++,product:prod,color:color,size:size,qty:qty,lookupType:'main',lp:prod,lc:lc,ls:size});
  renderCart();
  inpQty.value=1; checkAvail();
  btnAdd.textContent='✓ Added!'; btnAdd.style.background='#22c55e';
  setTimeout(function(){ if(btnAdd.textContent==='✓ Added!'){ btnAdd.textContent='＋ Add to Order'; btnAdd.style.background=''; } },1100);
});

inpQty.addEventListener('input', function() {
  var max=parseInt(inpQty.max), val=parseInt(inpQty.value);
  if (max&&val>max) inpQty.value=max;
});

// ── CART ──────────────────────────────────────────────────────────
function renderCart() {
  var total=cart.reduce(function(s,i){ return s+i.qty; },0);
  var cc=document.getElementById('cart-count');
  if (total>0){ cc.style.display='inline'; cc.textContent=total; } else { cc.style.display='none'; }
  var wrap=document.getElementById('cart-wrap');
  if (cart.length===0){ wrap.innerHTML='<p class="empty-msg">No items added yet.</p>'; return; }
  var rows=cart.map(function(item){ return '<tr><td><strong>'+item.product+'</strong></td><td>'+item.color+'</td><td>'+item.size+'</td><td>'+item.qty+'</td><td><button class="btn-rm" onclick="removeItem('+item.id+')">✕</button></td></tr>'; }).join('');
  wrap.innerHTML='<table><thead><tr><th>Product</th><th>Color</th><th>Size</th><th>Qty</th><th></th></tr></thead><tbody>'+rows+'<tr class="total-row"><td colspan="3">Total</td><td>'+total+'</td><td></td></tr></tbody></table>';
}

function removeItem(id) {
  cart=cart.filter(function(i){ return i.id!==id; });
  renderCart(); checkAvail();
}

// ── SUBMIT ORDER ──────────────────────────────────────────────────
document.getElementById('btn-submit').addEventListener('click', function() {
  var shop = SESSION_STORE ? SESSION_STORE.name : document.getElementById('cust-shop').value.trim();
  var errEl = document.getElementById('submit-error');
  errEl.style.display='none';
  if (!shop){ errEl.textContent='⚠ Please select a shop.'; errEl.style.display='block'; return; }
  if (cart.length===0){ errEl.textContent='⚠ Please add at least one item.'; errEl.style.display='block'; return; }
  var items=cart.map(function(i){ return {product:i.product,color:i.color,size:i.size,qty:i.qty,lookupType:i.lookupType,lp:i.lp,lc:i.lc,ls:i.ls}; });
  document.getElementById('loading-bar').style.display='block';
  document.getElementById('btn-submit').disabled=true;
  google.script.run
    .withSuccessHandler(function(result) {
      document.getElementById('loading-bar').style.display='none';
      if (result.success) {
        document.getElementById('order-id-display').textContent=result.orderId;
        lastOrder={orderId:result.orderId,customerName:shop,items:items,date:new Date().toLocaleDateString()};
        document.getElementById('order-form-wrap').style.display='none';
        document.getElementById('order-success').style.display='block';
      } else {
        document.getElementById('btn-submit').disabled=false;
        errEl.textContent='❌ Error: '+result.error; errEl.style.display='block';
      }
    })
    .withFailureHandler(function() {
      document.getElementById('loading-bar').style.display='none';
      document.getElementById('btn-submit').disabled=false;
      errEl.textContent='❌ Connection error. Please try again.'; errEl.style.display='block';
    })
    .submitOrder({customerName:shop,customerEmail:'',customerPhone:'',notes:'',items:items});
});

function resetOrderForm() {
  cart=[]; nextId=1; lastOrder=null;
  if (SESSION_STORE) document.getElementById('cust-shop').value=SESSION_STORE.name;
  if (prodSearchEl) prodSearchEl.value='';
  selProd.value=''; resetColor(); resetSize(); hideAvail();
  btnAdd.style.display='none'; renderCart();
  document.getElementById('order-form-wrap').style.display='block';
  document.getElementById('order-success').style.display='none';
  document.getElementById('btn-submit').disabled=false;
  document.getElementById('submit-error').style.display='none';
  document.getElementById('pdf-overlay').style.display='none';
}

function resetColor(){ selColor.innerHTML='<option value="">— Choose color —</option>'; selColor.disabled=true; }
function resetSize() { selSize.innerHTML='<option value="">— Choose size —</option>'; selSize.disabled=true; }
function hideAvail() { availBox.className='avail-box idle'; availTxt.textContent='Select product, color and size to check availability.'; }

renderCart();

// ── PDF ───────────────────────────────────────────────────────────
function groupItemsByProduct(items) {
  var map={},order=[];
  items.forEach(function(i){ if(!map[i.product]){ map[i.product]=[]; order.push(i.product); } map[i.product].push(i); });
  return order.map(function(pid){ return {product:pid,items:map[pid]}; });
}

function buildGroupedRows(items) {
  var groups=groupItemsByProduct(items), html='';
  groups.forEach(function(g) {
    var groupQty=g.items.reduce(function(s,i){ return s+i.qty; },0);
    html+='<tr><td colspan="4" style="padding:10px 12px 6px;background:#f8fafc;font-size:.8rem;font-weight:700;color:#1a1a2e;text-transform:uppercase;letter-spacing:.04em;border-top:2px solid #e2e8f0">'+g.product+'</td></tr>';
    g.items.forEach(function(i){ html+='<tr><td style="padding:8px 12px 8px 20px;border-bottom:1px solid #f0f2f5;color:#555;font-size:.88rem">'+i.color+'</td><td style="padding:8px 12px;border-bottom:1px solid #f0f2f5;color:#555;font-size:.88rem">'+i.size+'</td><td style="padding:8px 12px;border-bottom:1px solid #f0f2f5;color:#555;font-size:.88rem" colspan="2"></td><td style="padding:8px 12px;border-bottom:1px solid #f0f2f5;text-align:right;font-weight:600;color:#333;font-size:.88rem">'+i.qty+'</td></tr>'; });
    html+='<tr><td colspan="3" style="padding:7px 12px 10px 20px;font-size:.8rem;color:#888">Subtotal</td><td style="padding:7px 12px 10px;text-align:right;font-weight:700;color:#1a1a2e;font-size:.88rem;border-bottom:2px solid #e2e8f0">'+groupQty+' pcs</td></tr>';
  });
  return html;
}

function saveOrderPdf() {
  if (!lastOrder) return;
  var total=lastOrder.items.reduce(function(s,i){ return s+i.qty; },0);
  var rows=buildGroupedRows(lastOrder.items);
  document.getElementById('pdf-overlay-inner').innerHTML =
    '<div style="background:#1a1a2e;color:#fff;padding:24px;border-radius:10px 10px 0 0;text-align:center"><h1 style="margin:0 0 4px;font-size:1.4rem;color:#fff">Burmelin</h1><p style="margin:0;opacity:.7;font-size:.88rem;color:#fff">Order Confirmation</p></div>'
    +'<div style="border:1px solid #e2e8f0;border-top:none;border-radius:0 0 10px 10px;padding:24px;background:#fff">'
    +'<table style="width:100%;border-collapse:collapse;margin-bottom:20px;font-size:.9rem">'
    +'<tr><td style="padding:4px 0;color:#999;width:110px">Order ID</td><td style="font-weight:700;color:#1a1a2e">'+lastOrder.orderId+'</td></tr>'
    +'<tr><td style="padding:4px 0;color:#999">Date</td><td style="color:#333">'+lastOrder.date+'</td></tr>'
    +'<tr><td style="padding:4px 0;color:#999">Shop</td><td style="color:#333"><strong>'+lastOrder.customerName+'</strong></td></tr>'
    +'</table>'
    +'<table style="width:100%;border-collapse:collapse;font-size:.9rem"><thead><tr style="background:#f8fafc"><th style="padding:9px 12px;text-align:left;font-size:.75rem;text-transform:uppercase;color:#888;border-bottom:2px solid #e2e8f0" colspan="2">Color</th><th style="padding:9px 12px;text-align:left;font-size:.75rem;text-transform:uppercase;color:#888;border-bottom:2px solid #e2e8f0">Size</th><th style="padding:9px 12px;text-align:right;font-size:.75rem;text-transform:uppercase;color:#888;border-bottom:2px solid #e2e8f0">Qty</th></tr></thead><tbody>'+rows+'</tbody></table>'
    +'<div style="background:#1a1a2e;padding:12px 16px;margin-top:0;display:flex;justify-content:space-between;border-radius:0 0 8px 8px"><span style="color:#fff;font-weight:700">TOTAL</span><strong style="color:#fff;font-size:1.05rem">'+total+' pcs</strong></div>'
    +'</div>';
  document.getElementById('pdf-overlay').style.display='block';
  window.scrollTo(0,0);
}
</script>
