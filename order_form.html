<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Form</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 30px 16px;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }
    header h1 {
      font-size: 1.8rem;
      color: #1a1a2e;
      font-weight: 700;
    }
    header p {
      color: #666;
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f0f2f5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      color: #222;
      background: #fafafa;
      appearance: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    select:focus, input[type="number"]:focus {
      outline: none;
      border-color: #4f46e5;
      background: #fff;
    }
    select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .availability-box {
      margin: 20px 0;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 10px;
    }
    .availability-box.in-stock {
      background: #f0fdf4;
      border: 2px solid #22c55e;
      color: #15803d;
      display: flex;
    }
    .availability-box.out-of-stock {
      background: #fef2f2;
      border: 2px solid #ef4444;
      color: #b91c1c;
      display: flex;
    }
    .availability-box.not-selected {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      color: #64748b;
      display: flex;
    }
    .avail-icon {
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .btn-add {
      width: 100%;
      padding: 14px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: none;
    }
    .btn-add:hover { background: #4338ca; transform: translateY(-1px); }
    .btn-add:active { transform: translateY(0); }

    /* Order Summary */
    .order-count {
      font-size: 0.8rem;
      background: #4f46e5;
      color: #fff;
      border-radius: 20px;
      padding: 2px 9px;
      margin-left: 8px;
      font-weight: 700;
    }

    .empty-msg {
      text-align: center;
      color: #aaa;
      font-size: 0.95rem;
      padding: 20px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    thead th {
      background: #f8fafc;
      padding: 10px 12px;
      text-align: left;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      border-bottom: 2px solid #e2e8f0;
    }
    tbody td {
      padding: 11px 12px;
      border-bottom: 1px solid #f0f2f5;
      color: #333;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #fafafa; }

    .btn-remove {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .btn-remove:hover { background: #fef2f2; }

    .total-row td {
      font-weight: 700;
      color: #1a1a2e;
      background: #f8fafc;
      border-top: 2px solid #e2e8f0 !important;
    }

    .btn-clear {
      background: none;
      border: 2px solid #e2e8f0;
      color: #666;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: border-color 0.2s;
      margin-top: 14px;
      font-weight: 500;
    }
    .btn-clear:hover { border-color: #ef4444; color: #ef4444; }

    @media (max-width: 480px) {
      .row2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>🛒 Order Form</h1>
    <p>Select a product, color, and size to check availability</p>
  </header>

  <div class="card">
    <h2>Product Selection</h2>

    <div class="form-group">
      <label for="sel-product">Product</label>
      <select id="sel-product">
        <option value="">— Choose a product —</option>
      </select>
    </div>

    <div class="row2">
      <div class="form-group">
        <label for="sel-color">Color</label>
        <select id="sel-color" disabled>
          <option value="">— Choose color —</option>
        </select>
      </div>
      <div class="form-group">
        <label for="sel-size">Size</label>
        <select id="sel-size" disabled>
          <option value="">— Choose size —</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="inp-qty">Quantity</label>
      <input type="number" id="inp-qty" value="1" min="1" max="999">
    </div>

    <div class="availability-box not-selected" id="avail-box">
      <span class="avail-icon">ℹ️</span>
      <span id="avail-text">Select a product, color and size to check availability.</span>
    </div>

    <button class="btn-add" id="btn-add">＋ Add to Order</button>
  </div>

  <div class="card">
    <h2>
      Order Summary
      <span class="order-count" id="order-count" style="display:none">0</span>
    </h2>
    <div id="order-table-wrap">
      <p class="empty-msg">No items added yet.</p>
    </div>
  </div>

</div>

const selColor    = document.getElementById('sel-color');
const selSize     = document.getElementById('sel-size');
const inpQty      = document.getElementById('inp-qty');
const availBox    = document.getElementById('avail-box');
const availText   = document.getElementById('avail-text');
const btnAdd      = document.getElementById('btn-add');
const orderCount  = document.getElementById('order-count');
const orderTableWrap = document.getElementById('order-table-wrap');

// ─────────────────────────────────────────────
//  INIT: populate product dropdown
// ─────────────────────────────────────────────
function populateProducts() {
  // Group products
  const groups = {
    "Clothing (Coded)": ["4002","4003","C1","C3","C4"],
    "Shirts & Tops (Coded)": ["9014","9018","9021","B01","B109","B152","B156"],
    "Trousers (Coded)": ["F1165","F1165-F"],
    "Cargo Pants": Object.keys(INVENTORY).filter(k => k.includes("Cargo")),
    "Suits": ["3Pcs Suit","2Pcs Suit"]
  };

  for (const [groupLabel, products] of Object.entries(groups)) {
    const og = document.createElement('optgroup');
    og.label = groupLabel;
    for (const p of products) {
      if (!INVENTORY[p]) continue;
      const opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p;
      og.appendChild(opt);
    }
    selProduct.appendChild(og);
  }
}

// ─────────────────────────────────────────────
//  EVENT: product changed
// ─────────────────────────────────────────────
selProduct.addEventListener('change', () => {
  const prod = selProduct.value;
  resetColor();
  resetSize();
  hideAvailability();
  btnAdd.style.display = 'none';

  if (!prod) { selColor.disabled = true; return; }

  const colors = Object.keys(INVENTORY[prod]);
  selColor.innerHTML = '<option value="">— Choose color —</option>';
  colors.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    selColor.appendChild(opt);
  });
  selColor.disabled = false;
});

// ─────────────────────────────────────────────
//  EVENT: color changed
// ─────────────────────────────────────────────
selColor.addEventListener('change', () => {
  const prod  = selProduct.value;
  const color = selColor.value;
  resetSize();
  hideAvailability();
  btnAdd.style.display = 'none';

  if (!prod || !color) { selSize.disabled = true; return; }

  const sizes = Object.keys(INVENTORY[prod][color]);
  selSize.innerHTML = '<option value="">— Choose size —</option>';
  sizes.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    selSize.appendChild(opt);
  });
  selSize.disabled = false;
});

// ─────────────────────────────────────────────
//  EVENT: size changed → check availability
// ─────────────────────────────────────────────
selSize.addEventListener('change', checkAvailability);

function checkAvailability() {
  const prod  = selProduct.value;
  const color = selColor.value;
  const size  = selSize.value;

  if (!prod || !color || !size) {
    hideAvailability();
    btnAdd.style.display = 'none';
    return;
  }

  const stock = INVENTORY[prod]?.[color]?.[size];

  availBox.className = 'availability-box';

  if (stock === undefined) {
    availBox.classList.add('not-selected');
    availText.textContent = 'This combination is not found in the inventory.';
    btnAdd.style.display = 'none';
  } else if (stock > 0) {
    availBox.classList.add('in-stock');
    availText.innerHTML = `<strong>In Stock</strong> — ${stock} unit${stock !== 1 ? 's' : ''} available`;
    btnAdd.style.display = 'block';
  } else {
    availBox.classList.add('out-of-stock');
    availText.innerHTML = '<strong>Out of Stock</strong> — This item is currently unavailable';
    btnAdd.style.display = 'none';
  }
}

// ─────────────────────────────────────────────
//  EVENT: Add to Order
// ─────────────────────────────────────────────
btnAdd.addEventListener('click', () => {
  const prod  = selProduct.value;
  const color = selColor.value;
  const size  = selSize.value;
  const qty   = Math.max(1, parseInt(inpQty.value) || 1);
  const stock = INVENTORY[prod]?.[color]?.[size] ?? 0;

  if (!prod || !color || !size || stock <= 0) return;

  // Check if same item already in order
  const existing = orderItems.find(i => i.product === prod && i.color === color && i.size === size);
  if (existing) {
    existing.qty += qty;
  } else {
    orderItems.push({ id: nextId++, product: prod, color, size, qty, stock });
  }

  renderOrderTable();
  inpQty.value = 1;

  // Visual feedback
  btnAdd.textContent = '✓ Added!';
  btnAdd.style.background = '#22c55e';
  setTimeout(() => {
    btnAdd.textContent = '＋ Add to Order';
    btnAdd.style.background = '';
  }, 1200);
});

// ─────────────────────────────────────────────
//  RENDER ORDER TABLE
// ─────────────────────────────────────────────
function renderOrderTable() {
  const count = orderItems.reduce((s, i) => s + i.qty, 0);

  if (count > 0) {
    orderCount.style.display = 'inline';
    orderCount.textContent = count;
  } else {
    orderCount.style.display = 'none';
  }

  if (orderItems.length === 0) {
    orderTableWrap.innerHTML = '<p class="empty-msg">No items added yet.</p>';
    return;
  }

  const totalQty = orderItems.reduce((s, i) => s + i.qty, 0);

  let rows = orderItems.map(item => `
    <tr>
      <td><strong>${item.product}</strong></td>
      <td>${item.color}</td>
      <td>${item.size}</td>
      <td>${item.qty}</td>
      <td>
        <button class="btn-remove" onclick="removeItem(${item.id})" title="Remove">✕</button>
      </td>
    </tr>
  `).join('');

  orderTableWrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Color</th>
          <th>Size</th>
          <th>Qty</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${rows}
        <tr class="total-row">
          <td colspan="3">Total Items</td>
          <td>${totalQty}</td>
          <td></td>
        </tr>
      </tbody>
    </table>
    <button class="btn-clear" onclick="clearOrder()">🗑 Clear all</button>
  `;
}

function removeItem(id) {
  orderItems = orderItems.filter(i => i.id !== id);
  renderOrderTable();
}

function clearOrder() {
  orderItems = [];
  renderOrderTable();
}

// ─────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────
function resetColor() {
  selColor.innerHTML = '<option value="">— Choose color —</option>';
  selColor.disabled = true;
}
function resetSize() {
  selSize.innerHTML = '<option value="">— Choose size —</option>';
  selSize.disabled = true;
}
function hideAvailability() {
  availBox.className = 'availability-box not-selected';
  availText.textContent = 'Select a product, color and size to check availability.';
}

// ─────────────────────────────────────────────
//  START
// ─────────────────────────────────────────────
populateProducts();
renderOrderTable();
</script>
</body>
</html>
